name: Release

# Surum etiketi push edildiginde calisir:  git tag v0.1.0 && git push origin v0.1.0
#
# NuGet yayini Trusted Publishing (OIDC) ile yapilir; depoda API anahtari saklanmaz.
# Etkinlestirmek icin iki yer yapilandirilir:
#
#   GitHub  > Settings > Environments > "nuget" olustur > Required reviewers ekle
#   NuGet   > Trusted Publishing > politika:
#               Repository Owner  erenemrearik
#               Repository        TRCrypto.Net
#               Workflow File     release.yml
#               Environment       nuget
#               Glob Pattern      TRCrypto.*
#
# Ortam adi iki tarafta da "nuget" olmalidir; ayrisirsa NuGet anahtari vermez.
# Onay verilmedigi surece paketler yalnizca is ciktisi olarak uretilir, yayinlanmaz.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Derle, test et ve paketle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SourceLink commit bilgisine ihtiyac duyar

      - name: .NET kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Surumu etiketten oku
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Bagimliliklari yukle
        run: dotnet restore

      - name: Derle
        run: dotnet build -c Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      # Yalnizca birim testleri. Canli testler borsalarin erisilebilirligine baglidir;
      # yayini oraya bagladiginizda bir borsanin gecici kesintisi surumu durdurur.
      # Canli uclar haftalik zamanlanmis iste ayrica olculur.
      - name: Birim testleri
        run: >
          dotnet test -c Release --no-build --verbosity normal
          --filter FullyQualifiedName!~IntegrationTests

      - name: Paketle
        run: dotnet pack -c Release --no-build -o ./artifacts -p:Version=${{ steps.version.outputs.value }}

      - name: Paket icerigini dogrula
        run: |
          echo "Uretilen paketler:"
          ls -la ./artifacts
          for pkg in ./artifacts/*.nupkg; do
            echo "--- $pkg ---"
            unzip -l "$pkg" | grep -E "lib/|README" || true
          done

      - name: Paketleri yukle
        uses: actions/upload-artifact@v4
        with:
          name: nuget-paketleri
          path: ./artifacts/*.*nupkg

  publish:
    name: NuGet'e yayinla
    needs: build
    runs-on: ubuntu-latest
    # Onay gerektirir; yapilandirilmadiysa is burada bekler.
    environment: nuget

    permissions:
      contents: read
      # NuGet'in guvendigi kimlik belgesini GitHub'in uretebilmesi icin gerekli.
      # Bu izin olmadan asagidaki oturum acma adimi sessizce degil, acikca basarisiz olur.
      id-token: write

    steps:
      - name: Paketleri indir
        uses: actions/download-artifact@v4
        with:
          name: nuget-paketleri
          path: ./artifacts

      - name: .NET kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Depoda uzun omurlu bir anahtar tutulmaz. GitHub kisa omurlu bir kimlik belgesi
      # uretir, NuGet bunu kendi kayitli politikasiyla dogrular ve yalnizca bir saat
      # gecerli, tek kullanimlik bir anahtar dondurur.
      #
      # Politikanin eslesmesi gereken alanlar: depo sahibi, depo adi, bu dosyanin adi
      # (release.yml) ve yukaridaki ortam adi (nuget). Biri tutmazsa anahtar verilmez.
      - name: NuGet oturumu (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: arikerenemre

      - name: Yayinla
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  github-release:
    name: GitHub surumu olustur
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Paketleri indir
        uses: actions/download-artifact@v4
        with:
          name: nuget-paketleri
          path: ./artifacts

      - name: Surum notu olustur
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.*nupkg
          generate_release_notes: true
          # Etikette kisa cizgi varsa (v0.1.0-preview.1) surum on surumdur. NuGet bunu
          # zaten boyle isaretler; GitHub tarafinda da ayni gorunmezse iki liste
          # birbirini yalanlar.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Degisiklikler icin [CHANGELOG.md](CHANGELOG.md) dosyasina bakin.

            > Bu paket resmi degildir ve borsalarla bir baglantisi yoktur.
