name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Derle ve test et
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SourceLink commit bilgisine ihtiyac duyar

      - name: .NET kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Bagimliliklari yukle
        run: dotnet restore

      - name: Derle
        run: dotnet build -c Release --no-restore

      # Canli borsa API'sine cikan testler burada calistirilmaz: her PR icin borsanin
      # istek limitini yakmak ve CI'yi borsanin erisilebilirligine bagimli kilmak
      # istemiyoruz. Onlari zamanlanmis is (live-api.yml) calistirir.
      - name: Birim testleri
        run: >
          dotnet test -c Release --no-build --verbosity normal
          --filter FullyQualifiedName!~IntegrationTests

      - name: Paketle
        run: dotnet pack -c Release --no-build -o ./artifacts

      - name: Paketleri yukle
        uses: actions/upload-artifact@v4
        with:
          name: nuget-paketleri
          path: ./artifacts/*.*nupkg

  site:
    name: Dokumantasyon sitesi
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Site .md dosyalarindan uretilir. Uretilen dosya depoda tutuldugu icin bir
      # dokuman degisip site yeniden uretilmezse ikisi sessizce ayrisir; bu adim
      # bunu yakalar.
      - name: Siteyi yeniden uret
        run: node tools/site/build.mjs

      - name: Isleyiciyi dogrula
        run: node tools/site/check.mjs

      - name: Site guncel mi
        run: |
          if ! git diff --quiet -- docs/index.html; then
            echo "::error::docs/index.html guncel degil. 'node tools/site/build.mjs' calistirip sonucu commit edin."
            git diff --stat -- docs/index.html
            exit 1
          fi
          echo "Site kaynak dokumanlarla ayni."

  secret-scan:
    name: Secret taramasi
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
