<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="TRCrypto.Net, Türkiye kripto borsaları için .NET client ekosistemi. Kurulum, borsa rehberleri, API anahtarı bağlama ve teknik referans.">
<meta name="color-scheme" content="light dark">
<title>TRCrypto.Net Kılavuzu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────────────────────
   TRCrypto.Net dokumantasyonu

   Renk: Iznik cinisi. Kobalt, turkuaz ve bolu kirmizisi, beyaz sir uzerine.
   Turk seramik gelenegi projenin kimligiyle ortusuyor; kobalt tek vurgu rengi,
   turkuaz yalnizca "iki borsa tek kod" fikrini isaretlemek icin, kirmizi ise
   yalnizca uyari anlaminda kullanilir.

   Tipografi: basliklar Archivo, govde metni Source Serif 4, veri ve kod
   IBM Plex Mono. Govdenin serif olmasi bilincli: bu bir uygulama arayuzu degil,
   bir basvuru belgesi.
   ───────────────────────────────────────────────────────────────────────────── */

*, *::before, *::after { box-sizing: border-box; }

:root {
  color-scheme: light;

  --cobalt:      #1F3E8C;
  --cobalt-ink:  #16306F;
  --cobalt-soft: #E9EDF9;
  --cobalt-line: #C3CFEE;
  --turkuaz:     #10707B;
  --turkuaz-soft:#E2F1F2;
  --bole:        #A9361F;
  --bole-soft:   #FAEAE6;
  --amber:       #8A5D06;
  --amber-soft:  #FBF1DC;
  --ok:          #1B6340;
  --ok-soft:     #E3F2E9;

  --ground:    #FCFCFA;
  --surface:   #FFFFFF;
  --surface-2: #F3F5F9;
  --ink:       #141A29;
  --ink-2:     #3F4860;
  --ink-3:     #6B7590;
  --line:      #DEE2EC;
  --line-soft: #EBEEF4;

  --font-display: 'Archivo', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;

  --rail: 268px;
  --toc: 212px;
  --head: 58px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;

    --cobalt:      #97AEF4;
    --cobalt-ink:  #B9C8FA;
    --cobalt-soft: #19233F;
    --cobalt-line: #2E3C66;
    --turkuaz:     #58C2CB;
    --turkuaz-soft:#123037;
    --bole:        #EE8871;
    --bole-soft:   #351A15;
    --amber:       #DCA745;
    --amber-soft:  #33270F;
    --ok:          #64C892;
    --ok-soft:     #102C1F;

    --ground:    #0B0F18;
    --surface:   #111725;
    --surface-2: #171F31;
    --ink:       #E5EAF5;
    --ink-2:     #AAB4CB;
    --ink-3:     #7B86A2;
    --line:      #222C43;
    --line-soft: #192133;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;

  --cobalt:      #97AEF4;
  --cobalt-ink:  #B9C8FA;
  --cobalt-soft: #19233F;
  --cobalt-line: #2E3C66;
  --turkuaz:     #58C2CB;
  --turkuaz-soft:#123037;
  --bole:        #EE8871;
  --bole-soft:   #351A15;
  --amber:       #DCA745;
  --amber-soft:  #33270F;
  --ok:          #64C892;
  --ok-soft:     #102C1F;

  --ground:    #0B0F18;
  --surface:   #111725;
  --surface-2: #171F31;
  --ink:       #E5EAF5;
  --ink-2:     #AAB4CB;
  --ink-3:     #7B86A2;
  --line:      #222C43;
  --line-soft: #192133;
}

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16.5px;
  line-height: 1.68;
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--cobalt); text-decoration-color: var(--cobalt-line); text-underline-offset: 3px; }
a:hover { color: var(--cobalt-ink); text-decoration-color: currentColor; }

:focus-visible {
  outline: 2px solid var(--cobalt);
  outline-offset: 2px;
  border-radius: 2px;
}

/* ── Ust cubuk ────────────────────────────────────────────────────────────── */

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  height: var(--head);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 20px;
  background: color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 9px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.01em;
  color: var(--ink);
  text-decoration: none;
  white-space: nowrap;
}
.brand .tr { color: var(--cobalt); }
.brand .tag {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.topbar-spacer { flex: 1; }

.search-wrap { position: relative; width: min(340px, 42vw); }
.search-wrap input {
  width: 100%;
  height: 34px;
  padding: 0 34px 0 11px;
  font-family: var(--font-display);
  font-size: 13.5px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
}
.search-wrap input::placeholder { color: var(--ink-3); }
.search-wrap kbd {
  position: absolute;
  right: 8px; top: 50%;
  transform: translateY(-50%);
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--ink-3);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 1px 5px;
  pointer-events: none;
  background: var(--surface-2);
}
.search-wrap input:focus + kbd { opacity: 0; }

.icon-btn {
  height: 34px;
  min-width: 34px;
  padding: 0 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: var(--font-display);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink-2);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  cursor: pointer;
}
.icon-btn:hover { color: var(--ink); border-color: var(--cobalt-line); }
.icon-btn svg { width: 15px; height: 15px; }

.menu-btn { display: none; }

/* ── Iskelet ──────────────────────────────────────────────────────────────── */

.shell {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  align-items: start;
}

.rail {
  position: sticky;
  top: var(--head);
  height: calc(100vh - var(--head));
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 22px 14px 48px 20px;
  border-right: 1px solid var(--line);
}

.rail-group + .rail-group { margin-top: 22px; }
.rail-group > h2 {
  margin: 0 0 7px 9px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.rail-group ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.rail-group a {
  display: block;
  padding: 5px 10px;
  border-radius: 5px;
  font-family: var(--font-display);
  font-size: 13.5px;
  font-weight: 500;
  line-height: 1.42;
  color: var(--ink-2);
  text-decoration: none;
}
.rail-group a:hover { background: var(--surface-2); color: var(--ink); }
.rail-group a[aria-current="page"] {
  background: var(--cobalt-soft);
  color: var(--cobalt-ink);
  font-weight: 600;
}

.rail-foot {
  margin-top: 26px;
  padding: 14px 10px 0;
  border-top: 1px solid var(--line-soft);
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.75;
  color: var(--ink-3);
}
.rail-foot a { text-decoration: none; }
.rail-foot a:hover { text-decoration: underline; }

.page {
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--toc);
  gap: 44px;
  max-width: 1180px;
  padding: 40px 40px 96px;
}

.doc { min-width: 0; max-width: 74ch; }

/* ── Sayfa ici icindekiler ────────────────────────────────────────────────── */

.toc {
  position: sticky;
  top: calc(var(--head) + 40px);
  max-height: calc(100vh - var(--head) - 80px);
  overflow-y: auto;
  font-family: var(--font-display);
}
.toc h2 {
  margin: 0 0 9px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.toc ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.toc a {
  display: block;
  padding: 2px 0 2px 11px;
  border-left: 2px solid var(--line);
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--ink-3);
  text-decoration: none;
}
.toc a:hover { color: var(--ink); border-left-color: var(--cobalt-line); }
.toc a.active { color: var(--cobalt); border-left-color: var(--cobalt); font-weight: 600; }
.toc a.lvl3 { padding-left: 22px; font-size: 12px; }

/* ── Belge tipografisi ────────────────────────────────────────────────────── */

.doc-head { margin-bottom: 30px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
.doc-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--turkuaz);
}
.doc h1 {
  margin: 8px 0 0;
  font-family: var(--font-display);
  font-size: clamp(28px, 3.4vw, 38px);
  font-weight: 700;
  line-height: 1.14;
  letter-spacing: -0.021em;
  text-wrap: balance;
}
.doc-source {
  margin-top: 12px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--ink-3);
}
.doc-source a { color: var(--ink-3); }

.doc h2, .doc h3, .doc h4, .doc h5 {
  font-family: var(--font-display);
  line-height: 1.24;
  letter-spacing: -0.014em;
  text-wrap: balance;
  scroll-margin-top: calc(var(--head) + 18px);
}
.doc h2 {
  margin: 46px 0 14px;
  padding-top: 14px;
  border-top: 1px solid var(--line-soft);
  font-size: 23px;
  font-weight: 700;
}
.doc h3 { margin: 32px 0 10px; font-size: 17.5px; font-weight: 600; }
.doc h4 { margin: 24px 0 8px; font-size: 15px; font-weight: 600; color: var(--ink-2); }
.doc h5 {
  margin: 20px 0 6px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.doc > :first-child { margin-top: 0; }

.doc p { margin: 0 0 15px; }
.doc strong { font-weight: 600; color: var(--ink); }
.doc em { font-style: italic; }
.doc del { color: var(--ink-3); }

.doc ul, .doc ol { margin: 0 0 15px; padding-left: 1.35em; }
.doc li { margin-bottom: 5px; }
.doc li > ul, .doc li > ol { margin: 5px 0 4px; }
.doc ul { list-style: none; padding-left: 1.15em; }
.doc ul > li { position: relative; }
.doc ul > li::before {
  content: "";
  position: absolute;
  left: -0.95em;
  top: 0.72em;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--cobalt-line);
}
.doc ol { list-style: decimal; }
.doc ol > li::marker {
  font-family: var(--font-mono);
  font-size: 0.86em;
  color: var(--ink-3);
}

.doc hr {
  height: 0;
  margin: 34px 0;
  border: 0;
  border-top: 1px solid var(--line-soft);
}

.doc code {
  font-family: var(--font-mono);
  font-size: 0.855em;
  padding: 0.1em 0.34em;
  border-radius: 4px;
  background: var(--surface-2);
  border: 1px solid var(--line-soft);
  color: var(--ink);
  word-break: break-word;
}

/* ── Kod bloklari ─────────────────────────────────────────────────────────── */

.code {
  position: relative;
  margin: 0 0 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.code-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 32px;
  padding: 0 8px 0 12px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
}
.code-lang {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.code-bar .grow { flex: 1; }
.copy {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-3);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 2px 7px;
  cursor: pointer;
}
.copy:hover { color: var(--ink); background: var(--ground); border-color: var(--line); }
.copy[data-done="1"] { color: var(--ok); }

.code pre {
  margin: 0;
  padding: 13px 15px;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 12.9px;
  line-height: 1.66;
  tab-size: 4;
}
.code pre code { background: none; border: 0; padding: 0; font-size: inherit; }

/* Sozdizimi vurgusu: kod okunurlugu icin, sus olarak degil. */
.tok-c { color: var(--ink-3); font-style: italic; }
.tok-s { color: var(--turkuaz); }
.tok-k { color: var(--cobalt); font-weight: 600; }
.tok-n { color: var(--bole); }
.tok-t { color: var(--amber); }

/* ── Tablolar ─────────────────────────────────────────────────────────────── */

.table-wrap {
  margin: 0 0 20px;
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
}
.doc table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-display);
  font-size: 13.6px;
  line-height: 1.52;
  font-variant-numeric: tabular-nums;
}
.doc th {
  padding: 9px 13px;
  text-align: left;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--ink-3);
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.doc td {
  padding: 9px 13px;
  border-bottom: 1px solid var(--line-soft);
  vertical-align: top;
  color: var(--ink-2);
}
.doc tbody tr:last-child td { border-bottom: 0; }
.doc tbody tr:hover td { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
.doc td code { font-size: 0.9em; }
.doc td strong { color: var(--ink); }

/* Durum isaretleri hucre icinde rozete cevrilir: durum bir bakista okunmali. */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 1px 8px;
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  white-space: nowrap;
}
.pill.ok    { color: var(--ok);     background: var(--ok-soft); }
.pill.wait  { color: var(--ink-3);  background: var(--surface-2); }
.pill.warn  { color: var(--amber);  background: var(--amber-soft); }
.pill.no    { color: var(--bole);   background: var(--bole-soft); }

/* ── Alintilar ve uyari kutulari ──────────────────────────────────────────── */

.doc blockquote {
  margin: 0 0 20px;
  padding: 2px 0 2px 17px;
  border-left: 2px solid var(--cobalt-line);
  color: var(--ink-2);
}
.doc blockquote p:last-child { margin-bottom: 0; }

.callout {
  margin: 0 0 20px;
  padding: 13px 16px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--ink-3);
  border-radius: 7px;
  background: var(--surface);
}
.callout p:last-child { margin-bottom: 0; }
.callout-label {
  display: block;
  margin-bottom: 5px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}
.callout.note      { border-left-color: var(--cobalt);  background: var(--cobalt-soft); }
.callout.note      .callout-label { color: var(--cobalt-ink); }
.callout.tip       { border-left-color: var(--turkuaz); background: var(--turkuaz-soft); }
.callout.tip       .callout-label { color: var(--turkuaz); }
.callout.important { border-left-color: var(--turkuaz); background: var(--turkuaz-soft); }
.callout.important .callout-label { color: var(--turkuaz); }
.callout.warning   { border-left-color: var(--amber);   background: var(--amber-soft); }
.callout.warning   .callout-label { color: var(--amber); }
.callout.caution   { border-left-color: var(--bole);    background: var(--bole-soft); }
.callout.caution   .callout-label { color: var(--bole); }

/* ── Giris sayfasi ────────────────────────────────────────────────────────── */

.hero { padding-bottom: 4px; }
.hero .doc-eyebrow { color: var(--turkuaz); }
.hero h1 {
  margin: 10px 0 0;
  font-size: clamp(34px, 5vw, 52px);
  letter-spacing: -0.028em;
}
.hero .lede {
  margin: 16px 0 0;
  font-size: 18.5px;
  line-height: 1.6;
  color: var(--ink-2);
  max-width: 60ch;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(126px, 1fr));
  gap: 1px;
  margin: 30px 0 34px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.metric { padding: 13px 15px; background: var(--surface); }
.metric dt {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.metric dd {
  margin: 3px 0 0;
  font-family: var(--font-display);
  font-size: 25px;
  font-weight: 700;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.metric dd span { font-size: 13px; font-weight: 500; color: var(--ink-3); margin-left: 3px; }

/* Tez: ayni kod, iki borsa. Iki sutun bilerek esit; hicbiri ayricalikli degil. */
.thesis {
  margin: 0 0 20px;
  border: 1px solid var(--line);
  border-radius: 9px;
  overflow: hidden;
  background: var(--surface);
}
.thesis-out {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--line);
  border-top: 1px solid var(--line);
}
.venue { padding: 13px 16px; background: var(--surface-2); }
.venue-name {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.venue:nth-child(1) .venue-name { color: var(--cobalt); }
.venue:nth-child(2) .venue-name { color: var(--turkuaz); }
.venue-native {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-3);
  margin-top: 2px;
}
.venue-price {
  margin-top: 7px;
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.venue-price small { font-size: 11px; font-weight: 400; color: var(--ink-3); margin-left: 4px; }

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(232px, 1fr));
  gap: 12px;
  margin: 0 0 20px;
}
.card {
  display: block;
  padding: 15px 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  text-decoration: none;
  color: inherit;
}
.card:hover { border-color: var(--cobalt-line); background: var(--cobalt-soft); }
.card-title {
  font-family: var(--font-display);
  font-size: 14.5px;
  font-weight: 600;
  color: var(--ink);
}
.card-desc { margin-top: 4px; font-size: 13.5px; line-height: 1.5; color: var(--ink-3); }

/* ── Arama ────────────────────────────────────────────────────────────────── */

.results { margin-top: 4px; }
.result {
  display: block;

const DOCS = {"giris":{"title":"Genel bakış","heading":"Genel bakış","source":null,"body":null},"durum":{"title":"Durum ve yol haritası","heading":"Proje Durumu","source":"docs/DURUM.md","body":"> **Son güncelleme:** 27 Ağustos 2026\n> Bu dosya, projeye ara verip döndüğünüzde ya da yeni biri katıldığında okunacak\n> tek sayfalık özettir. Ayrıntı için ilgili belgelere bakın.\n\n---\n\n## Tek cümleyle\n\nBtcTurk **tamamlandı** (REST + WebSocket + shared); yalnızca kullanıcıya özel socket\nakışları eksik ve bunlar hesapta emir hareketi gerektiriyor.\n**Binance TR: REST + WebSocket + shared yüzey** çalışıyor; kimlik doğrulama bekliyor.\n\n---\n\n## Tamamlananlar\n\n### M0. Proje temeli ✅\n\n| Ne | Nerede |\n|---|---|\n| Solution, 5 hedef platform, merkezi paket yönetimi | `Directory.Build.props`, `Directory.Packages.props` |\n| Deterministic Release build, SourceLink, snupkg | `src/Directory.Build.props` |\n| Analyzer'lar warnings-as-errors | `.editorconfig` |\n| CI (derle/test/paketle/secret tara) | `.github/workflows/ci.yml` |\n| Secret koruması | `.gitignore`, `.gitleaks.toml`, `.githooks/pre-commit`, `.env.example` |\n\n### M1. BtcTurk public piyasa verisi ✅\n\n**Native uçlar** (`client.SpotApi.ExchangeData`):\n\n| Uç | Metod |\n|---|---|\n| `/api/v2/server/exchangeinfo` | `GetExchangeInfoAsync` · `GetServerTimeAsync` |\n| `/api/v2/ticker` | `GetTickersAsync` · `GetTickerAsync` |\n| `/api/v2/ticker/currency` | `GetTickersByQuoteAssetAsync` |\n| `/api/v2/orderbook` | `GetOrderBookAsync` |\n| `/api/v2/trades` | `GetTradesAsync` |\n\n### M2. Kimlik doğrulama ve private REST ✅\n\nİmzalama zinciri: `Base64(HMAC-SHA256(Base64Decode(secret), apiKey + stamp))`,\nbaşlıklar `X-PCK` / `X-Stamp` / `X-Signature`. Resmi test vektörü olmadığı için\ndeterministik vektörler üretilip testlere sabitlendi.\n\n**Hesap** (`client.SpotApi.Account`):\n\n| Uç | Metod |\n|---|---|\n| `/api/v1/users/balances` | `GetBalancesAsync` |\n| `/api/v1/users/transactions/trade` | `GetUserTradesAsync` |\n\n**Emirler** (`client.SpotApi.Trading`):\n\n| Uç | Metod |\n|---|---|\n| `GET /api/v1/openOrders` | `GetOpenOrdersAsync` |\n| `GET /api/v1/allOrders` | `GetOrdersAsync` |\n| `GET /api/v1/order/{id}` | `GetOrderAsync` |\n| `POST /api/v1/order` | `PlaceOrderAsync` |\n| `DELETE /api/v1/order` | `CancelOrderAsync` |\n\n### Kline verisi ayrı bir sunucuda ✅\n\n`GET graph-api.btcturk.com/v1/klines/history` → `ExchangeData.GetKlinesAsync`\n\nBu uç **ayrı bir host** kullanır, **standart zarfı taşımaz** ve zaman damgalarını\n**saniye** cinsinden döndürür. Ayrıntı: [vendor/btcturk-kline-and-trades.md](#/vendor-btcturk-kline)\n\n### Shared yüzey ✅\n\n`client.SpotApi.SharedClient` şu arayüzleri uygular:\n\n`ISpotSymbolRestClient` · `ISpotTickerRestClient` · `IOrderBookRestClient` ·\n`IRecentTradeRestClient` · `IKlineRestClient` · `IBalanceRestClient` ·\n`ISpotOrderRestClient`\n\nYani BtcTurk artık borsadan bağımsız kodun tüm ortak REST işlemlerini destekliyor.\n\n\n### M3. WebSocket ✅\n\nProtokol resmi dokümanda gövdesiz listelendiği için **canlı bağlantıdan** çözüldü.\nAyrıntı: [vendor/btcturk-websocket.md](#/vendor-btcturk-ws)\n\n| Kanal | Metod | Shared |\n|---|---|---|\n| ticker | `SubscribeToTickerUpdatesAsync` | `ITickerSocketClient` |\n| trade | `SubscribeToTradeUpdatesAsync` | `ITradeSocketClient` |\n| orderbook | `SubscribeToOrderBookUpdatesAsync` | `IOrderBookSocketClient` |\n\nMesajlar `[tip, gövde]` dizisi biçimindedir; yönlendirme dizinin ilk elemanına göre\nyapılır. Yeniden bağlanma ve abonelik geri kurma kütüphane tarafından sağlanır.\n\n\n### M4. Binance TR ✅\n\nEnvanter canlı denemeyle çıkarıldı; dokümantasyon hangi uçların gerçekten public\nolduğunu söylemiyor. Ayrıntı: [vendor/binance-tr-capabilities.md](#/vendor-binance-tr)\n\n| Uç | Metod |\n|---|---|\n| `/open/v1/common/time` | `GetServerTimeAsync` |\n| `/open/v1/common/symbols` | `GetSymbolsAsync` |\n| `/open/v1/market/depth` | `GetOrderBookAsync` |\n| `/open/v1/market/agg-trades` | `GetAggregatedTradesAsync` |\n\n**WebSocket** (`socket.SpotApi`): ticker · trade · aggTrade · depth · depth5/10/20 · kline\n\nAyrıntı: [vendor/binance-tr-websocket.md](#/vendor-binance-tr-ws)\n\n**Bağımlılık enjeksiyonu:** `services.AddTRCryptoBinanceTR(...)` çağrısı REST ve\nWebSocket istemcilerini birlikte kaydeder.\n\n**Private uçlar** (`client.SpotApi.Account` ve `client.SpotApi.Trading`): hesap bilgisi,\nemir oluşturma, emir listesi, emir ayrıntısı, emir iptali ve işlem geçmişi. İmzalama\netkin; canlı hesap doğrulaması anahtar geldiğinde yapılacak.\n\n**Shared yüzey:** REST tarafında `ISpotSymbolRestClient` · `IOrderBookRestClient` ·\n`IRecentTradeRestClient` · `IBalanceRestClient` · `ISpotOrderRestClient`; socket\ntarafında `ITickerSocketClient` · `ITradeSocketClient` · `IOrderBookSocketClient` ·\n`IKlineSocketClient`.\n\nAynı kod artık iki borsayla çalışıyor ve bu canlı olarak doğrulandı. Tek bir `SharedSymbol` ile\nher iki borsadan paralel fiyat okunuyor, her biri kendi sembol biçimini (`BTCTRY` /\n`BTC_TRY`) kullanırken çağıran kod hiçbirini görmüyor.\n\nBtcTurk'tan üç önemli fark:\n\n1. **Zarf farklı.** `success` alanı yok, başarı `code == 0`; mesaj `msg`; zarfta `timestamp`\n2. **Sembol alt çizgili.** `BTC_TRY` kullanılır, BtcTurk ise `BTCTRY` yazar\n3. **Ticker REST'te anahtarsız alınamıyor.** `/api/v3/*` burada public değil, ama socket'te çalışıyor\n\n### Belgeler ✅\n\n| Dosya | İçerik |\n|---|---|\n| `docs/credentials/README.md` | Genel güvenlik: saklama, least-privilege, sızıntı durumu |\n| `docs/credentials/btcturk.md` | BtcTurk'te adım adım API anahtarı alma ve bağlama |\n| `docs/credentials/binance-tr.md` | Binance TR'de anahtar alma; imzalama şemasının BtcTurk'ten farkları |\n| `docs/vendor/` | Üç borsanın resmi kaynaklı uç envanteri, istek limitleri, kline ve işlem geçmişi |\n| `docs/spec/` | Orijinal spesifikasyon + doğrulama ekleri (D-1…D-44) |\n\n---\n\n## Yapılmayanlar\n\n| Konu | Neden |\n|---|---|\n| **Kullanıcıya özel socket akışları** | Giriş çalışıyor, ama mesaj gövdeleri (423/441/451/452/453) hesapta **hareket olmadan gelmiyor** ve hiçbir yerde belgelenmemiş. Modelleri yazmak için gerçek emir hareketi gerekiyor |\n| **`tax` alanının shared karşılığı** | BtcTurk işlem başına vergi bildiriyor; `SharedUserTrade` bunu temsil edemiyor. Native modelde korunur, shared yüzeyde yalnızca komisyon aktarılır |\n| **Emir uçlarının canlı doğrulaması** | Gerçek emir vermeyi gerektirir; bilinçli olarak ertelendi. İmzalama ve okuma uçları canlı doğrulandı |\n| **Binance TR: private uçların canlı doğrulaması** | Şema resmi dokümantasyondan alındı, imzalama yayımlanmış test vektörüyle doğrulandı. Gerçek bir hesaba karşı denenmesi anahtar geldiğinde yapılacak; `AuthenticationProbeTests` bunu ilk çalıştırmada bildirir |\n| **Binance TR: REST ticker** | Borsa anahtarsız REST ticker sunmuyor; **socket üzerinden çalışıyor** |\n| **Paribu adaptörü** | Uç envanteri çıkarıldı, kod yazılmadı. Borsanın resmi API'si var; public ticker ve emir defteri canlı doğrulandı |\n| **Bitexen adaptörü** | Sırada |\n| **`gitleaks` yerel taraması** | Araç makinede kurulu değil. Yapılandırma ve hook hazır; CI'da çalışacak |\n\n---\n\n## Doğrulama durumu\n\nSon çalıştırma (27 Ağu 2026):\n\n```\ndotnet build -c Release   →  0 error, 5 TFM\ndotnet test  -c Release   →  212/212 birim · 13 canli API · 2 atlandi (anahtar yok)\n                             birim testler her PR'da, canli testler haftalik iste\ndotnet pack  -c Release   →  .nupkg + .snupkg\ncanlı API                 →  379 parite, native == shared\n```\n\nÖrnek uygulama canlı public API'ye karşı uçtan uca doğrulama yapar\n(kimlik bilgisi gerekmez):\n\n```bash\ndotnet run --project examples/TRCrypto.Examples.Console\n```\n\nSon bölüm (`[11] Iki borsa, tek kod`) projenin varlık nedenini çalıştırarak gösterir:\ntek bir `SharedSymbol` ile her iki borsadan REST ve WebSocket üzerinden fiyat okunur,\nçağıran kod hiçbir borsanın sembol biçimini veya zarfını görmez.\n\n---\n\n## Bilinmesi gereken kararlar\n\n1. **Endpoint'ler uydurulmaz.** Yalnızca resmi dokümantasyondan doğrulanan uçlar yazılır\n   (ADR-010). Doğrulanamayan uç, yazılmak yerine `docs/vendor/` altında \"dondurulmamış\"\n   olarak işaretlenir.\n2. **Fixture'lar canlı API'den alınır.** Resmi örnek yanıtlar eksik ya da yanıltıcı olabiliyor;\n   aşağıdaki bulgular bunun kanıtı.\n3. **Enum'larda `Unknown` üyesi tanımlanmaz.** CryptoExchange.Net konvansiyonu: bilinmeyen\n   değer tanımsız bir enum değerine düşer, `Enum.IsDefined` ile tespit edilir.\n4. **Sembol adı ayrıştırılmaz.** BtcTurk base/quote'u ayrı alanlarda veriyor.\n5. **Varlık türü tahmin edilmez.** Borsa `currencyType` alanıyla bildiriyor.\n6. **Çekim izni hiçbir yerde önerilmez.** Kütüphane bu izne ihtiyaç duymaz.\n\n---\n\n## Dokümantasyonda olmayan, canlı API'de bulunan davranışlar\n\nAyrıntısı `docs/spec/` ekinde D-7…D-31. En önemlisi:\n\n> **`code` alanının tipi uçlar arasında tutarsız:** çoğu uç `0` (sayı) döndürürken\n> emir defteri `\"SUCCESS\"` (metin) döndürüyor. `int` olarak modellemek emir defteri\n> çağrılarını tamamen kırıyordu.\n\nDiğerleri: başarılı yanıtta `message` boş string (null değil); `numeratorSymbol` vs\n`numerator` isim tutarsızlığı; ticker tek parite için de dizi döndürüyor; işlem\nyanıtında dokümante edilmemiş `side` alanı.\n\n---\n\n## Sonraki adım\n\n**1. Sonraki borsa (M4)**\n\nBinance TR. Convention'lar BtcTurk üzerinde eksiksiz oturdu; aynı sıra izlenir:\nvendor freeze → public REST → auth → private REST → WebSocket → shared.\n\n**2. Kullanıcıya özel socket akışları**\n\nEmir iptalinin kesinleştiği kanal 452 burada. Canlı bir hesap gerektirir.\n\n**3. Ön sürüm**\n\nBtcTurk tamamlandığına göre NuGet v0.1.0-preview yayınlanabilir. Workflow hazır;\n`NUGET_API_KEY` ve environment onayı eksik.\n\n---\n\n## ✅ Canlı hesap doğrulaması yapıldı (26 Ağu 2026)\n\nGerçek bir hesaba karşı doğrulananlar. Yalnızca okuma yapıldı, emir oluşturulmadı:\n\n| Doğrulama | Sonuç |\n|---|---|\n| REST imzalama | ✅ Kabul edildi |\n| Bakiye ucu | ✅ Ayrıştırıldı; toplam = serbest + kilitli |\n| Ondalık ayırıcı | ✅ **Nokta.** Dokümantasyondaki virgüllü örnek yanıltıcıymış |\n| Socket giriş imzası | ✅ `publicKey + nonce`, REST'ten farklı. Dört aday denendi |\n\n**Hâlâ doğrulanmayan:** emir oluşturma/iptal uçları ve özel akış mesajları.\n\n### Özel akışlar neden bekliyor\n\nGiriş çalışıyor, ama `423` (UserTrade), `441` (OrderMatch), `451`/`452`/`453` (Order*)\nmesajlarının **gövdeleri hiçbir yerde belgelenmemiş** ve bu mesajlar yalnızca hesapta\nemir hareketi olduğunda üretiliyor. Giriş sonrası 45 saniye dinlendi; hiçbiri gelmedi.\n\nModelleri yazmak için gerçek bir emir vermek gerekirdi. Bu bilinçli olarak ertelendi:\nalan adlarını tahmin etmek, projenin endpoint uydurmama kuralının ihlali olurdu.\n\nHazır olduğunda iki yol var:\n\n| Yol | Öğrenilenler | Risk |\n|---|---|---|\n| Piyasadan uzak limit emri + iptal | ,  | Emir asla eşleşmez, para el değiştirmez. *Al-Sat* izni gerekir |\n| Gerçek eşleşen emir | + ,  | Gerçek para hareket eder, komisyon ödenir. Ayrı ve düşük bakiyeli hesap şart |\n\n---\n\n## ⚠️ Açık konu: sistem saati\n\nGeliştirme makinesinin saati düzeltildi; kalan sapma **~1,8 saniye**. Değer BtcTurk ve\nBinance TR sunucularına karşı ayrı ayrı ölçüldü ve ikisi de aynı sonucu verdiği için\nölçüm hatası değil, gerçek bir kayma.\n\n| | Tolerans | Durum |\n|---|---|---|\n| BtcTurk | geniş | ✅ sorun yok, imzalı uçlar canlı doğrulandı |\n| Binance TR | `recvWindow` varsayılan **5000 ms** | ⚠️ pencere içinde, ama payı ~3,2 saniye |\n\nBinance TR'nin penceresi dar olduğu için bu kayma büyürse imzalı istekler reddedilir.\n`ServerTimeIntegrationTests` her çalıştırmada sapmayı ölçer ve pencere aşılırsa\nbaşarısız olur. Böylece sorun, anahtarı bağladıktan sonra değil öncesinde görünür.\n\nMakine etki alanına bağlı olduğundan saat etki alanı denetleyicisinden gelir; kalıcı\nçözüm sistem yöneticisi tarafındadır.\n\n```bash\ndotnet test --filter \"FullyQualifiedName~ServerTimeIntegrationTests\" -l \"console;verbosity=detailed\"\n```"},"btcturk":{"title":"TRCrypto.BtcTurk","heading":"TRCrypto.BtcTurk","source":"src/TRCrypto.BtcTurk/README.md","body":"[![License](https://img.shields.io/badge/lisans-MIT-blue?style=flat-square)](https://github.com/erenemrearik/TRCrypto.Net/blob/main/LICENSE)\n[![.NET](https://img.shields.io/badge/.NET-8%20|%209%20|%2010%20|%20standard2.0%20|%20standard2.1-512BD4?style=flat-square&logo=dotnet&logoColor=white)](#kurulum)\n[![CryptoExchange.Net](https://img.shields.io/badge/CryptoExchange.Net-12.5.0-orange?style=flat-square)](https://github.com/JKorf/CryptoExchange.Net)\n\nBtcTurk REST ve WebSocket API'leri için .NET client kütüphanesi.\n[CryptoExchange.Net](https://github.com/JKorf/CryptoExchange.Net) üzerine kuruludur.\n\n> **Resmi değildir.** Bu paket bağımsız bir çalışmadır; BtcTurk ile bir bağlantısı yoktur.\n\n## Kurulum\n\n```bash\ndotnet add package TRCrypto.BtcTurk\n```\n\nHedef platformlar: `net8.0` · `net9.0` · `net10.0` · `netstandard2.0` · `netstandard2.1`\n\n## Hızlı başlangıç\n\nPiyasa verisi herkese açıktır; API anahtarı gerekmez.\n\n```csharp\nusing TRCrypto.BtcTurk.Clients;\n\nvar client = new BtcTurkRestClient();\n\nvar result = await client.SpotApi.ExchangeData.GetTickerAsync(\"BTCTRY\");\nif (!result.Success)\n{\n    Console.WriteLine(result.Error);\n    return;\n}\n\nConsole.WriteLine($\"BTC/TRY: {result.Data.LastPrice:N0}\");\n```\n\nİstemci yeniden kullanılabilir ve iş parçacığı güvenlidir. Her istek için yenisini\noluşturmayın.\n\n## Native API\n\n```csharp\nvar api = client.SpotApi.ExchangeData;\n\nawait api.GetExchangeInfoAsync();                    // pariteler, varliklar, sunucu saati\nawait api.GetServerTimeAsync();\nawait api.GetTickersAsync();                         // tum pariteler\nawait api.GetTickerAsync(\"BTCTRY\");                  // tek parite\nawait api.GetTickersByQuoteAssetAsync(\"TRY\");        // TRY pariteleri\nawait api.GetOrderBookAsync(\"BTCTRY\", limit: 25);\nawait api.GetTradesAsync(\"BTCTRY\", limit: 50);       // en fazla 50\nawait api.GetKlinesAsync(\"BTCTRY\", KlineInterval.OneHour);\n```\n\nKimlik doğrulama gerektirenler:\n\n```csharp\nawait client.SpotApi.Account.GetBalancesAsync();\nawait client.SpotApi.Account.GetUserTradesAsync(\"BTCTRY\");\n\nawait client.SpotApi.Trading.GetOpenOrdersAsync(\"BTCTRY\");\nawait client.SpotApi.Trading.GetOrdersAsync(\"BTCTRY\", limit: 100);\nawait client.SpotApi.Trading.GetOrderAsync(orderId);\n```\n\n## Gerçek zamanlı akışlar\n\n```csharp\nusing TRCrypto.BtcTurk.Clients;\n\nvar socket = new BtcTurkSocketClient();\n\nvar sub = await socket.SpotApi.SubscribeToTickerUpdatesAsync(\"BTCTRY\",\n    update => Console.WriteLine(update.Data.LastPrice));\n\nif (!sub.Success)\n{\n    Console.WriteLine(sub.Error);\n    return;\n}\n\n// Kapanista abonelikleri kapatin\nawait sub.Data.CloseAsync();\n```\n\nKanallar: ticker, işlemler ve emir defteri. Bağlantı koptuğunda kütüphane yeniden bağlanır\nve açık abonelikleri kendiliğinden yeniden kurar.\n\nEmir defteri güncellemeleri bir **sıra numarası** taşır (`Sequence`); numarada atlama\ngörürseniz defteri geçersiz sayıp yeni bir görüntü almalısınız.\n\nHandler'ları kısa tutun ve ağır işi bir kuyruğa aktarın.\n\n> Kullanıcıya özel akışlar (emir/bakiye bildirimleri) henüz uygulanmadı.\n\n## Emir işlemleri\n\n```csharp\nvar client = new BtcTurkRestClient(options =>\n    options.ApiCredentials = new BtcTurkCredentials(apiKey, apiSecret));\n\nvar placed = await client.SpotApi.Trading.PlaceOrderAsync(\n    \"BTCTRY\", OrderSide.Buy, OrderMethod.Limit, quantity: 0.001m, price: 3_000_000m);\n\nif (placed.Success)\n    Console.WriteLine(placed.Data.Id);\n\nawait client.SpotApi.Trading.CancelOrderAsync(placed.Data.Id);\n```\n\n> ⚠️ **Emir iptali eşzamansızdır.** Başarılı bir iptal yanıtı isteğin *alındığını* bildirir;\n> kesinleşme WebSocket üzerinden duyurulur. Emrin gerçekten iptal edildiğini varsaymak\n> yerine durumunu ayrıca sorgulayın.\n>\n> ⚠️ Emir oluşturma istekleri zaman aşımında **otomatik olarak yeniden denenmez.** Emir\n> borsada oluşmuş olabilir. Önce durumu doğrulayın.\n\nGeçersiz emirler ağa çıkılmadan reddedilir: eksik fiyat, negatif miktar, stop emrinde\neksik tetikleme fiyatı.\n\n## Shared API: borsadan bağımsız kullanım\n\nAynı kodun farklı borsalarla çalışmasını sağlar. Native sembol formatı hiç görünmez:\n\n```csharp\nusing CryptoExchange.Net.SharedApis;\n\nISpotTickerRestClient tickers = client.SpotApi.SharedClient;\n\nvar symbol = new SharedSymbol(TradingMode.Spot, \"BTC\", \"TRY\");\nvar result = await tickers.GetSpotTickerAsync(new GetTickerRequest(symbol));\n```\n\n**REST:** `ISpotSymbolRestClient` · `ISpotTickerRestClient` · `IOrderBookRestClient` ·\n`IRecentTradeRestClient` · `IKlineRestClient` · `IBalanceRestClient` · `ISpotOrderRestClient`\n\n**WebSocket:** `ITickerSocketClient` · `ITradeSocketClient` · `IOrderBookSocketClient`\n\nÇalışma anında yetenek keşfi:\n\n```csharp\nvar info = client.SpotApi.SharedClient.Discover();\n```\n\n## Sembol formatı\n\nBtcTurk sembolleri birleşik ve büyük harf bekler: `BTCTRY`.\n\n```csharp\nBtcTurkExchange.FormatSymbol(\"BTC\", \"TRY\", TradingMode.Spot);  // \"BTCTRY\"\nBtcTurkExchange.FormatSymbol(\"BTC\", \"TL\",  TradingMode.Spot);  // \"BTCTRY\" - TL takma adi\n```\n\nYanıtlarda base/quote ayrı alanlar olarak gelir; sembol adını ayrıştırmanız gerekmez.\n\n## Varlık türleri\n\nBorsa her varlığın türünü kendisi bildirir; sembol adından tahmin edilmez.\n\n```csharp\nvar info = await client.SpotApi.ExchangeData.GetExchangeInfoAsync();\nvar tryAsset = info.Data.Currencies.Single(x => x.Symbol == \"TRY\");\n\nConsole.WriteLine(tryAsset.CurrencyType);   // Fiat\n```\n\n## Hata yönetimi\n\nHatalar istisna olarak fırlatılmaz. **`Data`'ya erişmeden önce `Success` kontrol edin.**\n\nBtcTurk iş mantığı hatalarını HTTP 200 içinde `\"success\": false` olarak döndürür; kütüphane\nbunu başarısız sonuca çevirir ve borsanın kodu/mesajını `Error` içinde taşır.\n\n## Bağımlılık enjeksiyonu\n\nTek çağrı hem REST hem WebSocket istemcisini kaydeder.\n\n```csharp\nbuilder.Services.AddTRCryptoBtcTurk(options =>\n{\n    // Kimlik bilgisi her iki istemciye de uygulanır; public uçlar için gerekmez.\n    options.ApiCredentials = new BtcTurkCredentials(key, secret);\n});\n\npublic sealed class PriceService(IBtcTurkRestClient rest, IBtcTurkSocketClient socket)\n{\n    // Enjekte edilen istemcileri yeniden kullanın. Socket istemcisi tekildir:\n    // açık bağlantıları taşır ve abonelikleri kendi içinde birleştirir.\n}\n```\n\n## İstek limitleri\n\nPublic uçlar IP bazlı sınırlıdır (ticker 600/dk, emir defteri 180/dk, OHLC 120/dk,\ngrafik API 600/10dk). WebSocket bağlantı isteği dakikada 15 ile sınırlıdır.\nKütüphane limitleri kendisi uygular.\n\n## Kimlik doğrulama\n\nBakiye ve emir uçları API anahtarı gerektirir. Anahtar alma ve bağlama rehberi:\n[docs/credentials/btcturk.md](https://github.com/erenemrearik/TRCrypto.Net/blob/main/docs/credentials/btcturk.md)\n\n> Kütüphane hiçbir özelliği için **çekim (withdrawal) iznine** ihtiyaç duymaz.\n> Anahtarınızda bu izni açmayın.\n\n## Desteklenen uçlar\n\n| Uç | Metod | Shared |\n|---|---|---|\n| `/api/v2/server/exchangeinfo` | `GetExchangeInfoAsync` · `GetServerTimeAsync` | `ISpotSymbolRestClient` |\n| `/api/v2/ticker` | `GetTickersAsync` · `GetTickerAsync` | `ISpotTickerRestClient` |\n| `/api/v2/ticker/currency` | `GetTickersByQuoteAssetAsync` | ✅ |\n| `/api/v2/orderbook` | `GetOrderBookAsync` | `IOrderBookRestClient` |\n| `/api/v2/trades` | `GetTradesAsync` | `IRecentTradeRestClient` |\n| Kline (graph-api) | `GetKlinesAsync` | `IKlineRestClient` |\n| `/api/v1/users/balances` | `Account.GetBalancesAsync` | `IBalanceRestClient` |\n| `/api/v1/users/transactions/trade` | `Account.GetUserTradesAsync` | `ISpotOrderRestClient` |\n| `/api/v1/openOrders` | `Trading.GetOpenOrdersAsync` | `ISpotOrderRestClient` |\n| `/api/v1/allOrders` | `Trading.GetOrdersAsync` | `ISpotOrderRestClient` |\n| `/api/v1/order/{id}` | `Trading.GetOrderAsync` | `ISpotOrderRestClient` |\n| `POST /api/v1/order` | `Trading.PlaceOrderAsync` | `ISpotOrderRestClient` |\n| `DELETE /api/v1/order` | `Trading.CancelOrderAsync` | `ISpotOrderRestClient` |\n| WebSocket: ticker · trade · orderbook | `SocketClient.SpotApi.SubscribeTo…` | `ITickerSocketClient` · `ITradeSocketClient` · `IOrderBookSocketClient` |\n| WebSocket: tüm pariteler tek abonelikte | `SubscribeToAllTickerUpdatesAsync` | `ITickersSocketClient` |\n| Kullanıcı socket akışları | ⏳ | ⏳ |\n\nResmi API belgeleri: [docs.btcturk.com](https://docs.btcturk.com/)\n\n## Lisans\n\nMIT"},"binance-tr":{"title":"TRCrypto.BinanceTR","heading":"TRCrypto.BinanceTR","source":"src/TRCrypto.BinanceTR/README.md","body":"[![License](https://img.shields.io/badge/lisans-MIT-blue?style=flat-square)](https://github.com/erenemrearik/TRCrypto.Net/blob/main/LICENSE)\n[![.NET](https://img.shields.io/badge/.NET-8%20|%209%20|%2010%20|%20standard2.0%20|%20standard2.1-512BD4?style=flat-square&logo=dotnet&logoColor=white)](#kurulum)\n[![Durum](https://img.shields.io/badge/durum-REST%20+%20WebSocket%20+%20hesap-yellow?style=flat-square)](#desteklenen-uçlar)\n\nBinance TR REST ve WebSocket API'leri için .NET client kütüphanesi.\n[CryptoExchange.Net](https://github.com/JKorf/CryptoExchange.Net) üzerine kuruludur.\n\n> **Resmi değildir.** Bu paket bağımsız bir çalışmadır; Binance TR ile bir bağlantısı yoktur.\n\n## Kurulum\n\n```bash\ndotnet add package TRCrypto.BinanceTR\n```\n\nHedef platformlar: `net8.0` · `net9.0` · `net10.0` · `netstandard2.0` · `netstandard2.1`\n\n## Hızlı başlangıç\n\n```csharp\nusing TRCrypto.BinanceTR.Clients;\n\nvar client = new BinanceTRRestClient();\n\nvar result = await client.SpotApi.ExchangeData.GetOrderBookAsync(\"BTC_TRY\", limit: 5);\nif (!result.Success)\n{\n    Console.WriteLine(result.Error);\n    return;\n}\n\nConsole.WriteLine($\"En iyi alis: {result.Data.Bids[0].Price:N0}\");\n```\n\n## Sembol formatı\n\n> [!IMPORTANT]\n> Binance TR sembollerinde **alt çizgi** kullanır: `BTC_TRY`.\n> BtcTurk ise birleşik yazar (`BTCTRY`). İki borsa için tek bir biçimlendirme kullanılamaz.\n\n```csharp\nBinanceTRExchange.FormatSymbol(\"BTC\", \"TRY\", TradingMode.Spot);  // \"BTC_TRY\"\nBinanceTRExchange.FormatSymbol(\"BTC\", \"TL\",  TradingMode.Spot);  // \"BTC_TRY\" - TL takma adi\n```\n\nYanıtlarda base/quote ayrı alanlarda gelir; sembol adını ayrıştırmanız gerekmez.\n\n## Bilinmesi gereken sınırlar\n\n> [!WARNING]\n> **Ticker verisi anahtarsız alınamıyor.** Global Binance'te herkese açık olan\n> `/api/v3/*` uçları burada API anahtarı ister. Bu nedenle bu sürümde ticker desteği yok.\n\nAyrıca borsanın `market/trades` ve `market/klines` uçları şu an **başarılı görünüp boş\nliste** döndürüyor (denenen tüm paritelerde). İşlem verisi için toplu işlemler ucu,\nmum verisi için WebSocket akışı kullanılmalıdır. Ayrıntı:\n[docs/vendor/binance-tr-capabilities.md](https://github.com/erenemrearik/TRCrypto.Net/blob/main/docs/vendor/binance-tr-capabilities.md)\n\n## Emir defteri kademe sayısı\n\nBorsa yalnızca şu değerleri kabul eder: **5, 10, 20, 50, 100, 500, 1000**.\n\nDiğer değerler yanıltıcı bir `Incorrect Page number` hatasıyla reddedilir. Hata mesajı\nsorunun limit olduğunu söylemez. Kütüphane bunu **ağa çıkmadan** reddeder.\n\n## Hata yönetimi\n\nHatalar istisna olarak fırlatılmaz. **`Data`'ya erişmeden önce `Success` kontrol edin.**\n\nBinance TR başarıyı `code == 0` ile bildirir; bir `success` alanı yoktur ve hatalar da\nHTTP 200 içinde döner. Kütüphane bunu başarısız sonuca çevirir.\n\n## Kimlik doğrulama\n\nBakiye, emir ve işlem geçmişi uçları API anahtarı ister. İmzalama şeması resmi\ndokümantasyondan alındı ve yayımlanmış imza test vektörüyle doğrulandı.\n\n```csharp\nvar client = new BinanceTRRestClient(options =>\n{\n    options.ApiCredentials = new BinanceTRCredentials(key, secret);\n});\n\nvar account = await client.SpotApi.Account.GetAccountAsync();\n```\n\n> [!NOTE]\n> Private uçlar henüz **canlı bir hesaba karşı çalıştırılmadı.** Şema doğru kabul\n> ediliyor ancak bunun kanıtı bir anahtar bağlandığında elde edilecek; hazır bekleyen\n> sonda testleri (`AuthenticationProbeTests`) bunu ilk çalıştırmada bildirir.\n\n> [!WARNING]\n> Sistem saatiniz sunucuyla uyumlu olmalıdır. Borsa imzalı istekleri yalnızca\n> `recvWindow` içinde kabul eder ve varsayılan pencere **5000 ms**'dir. Bu, BtcTurk'ün\n> toleransına göre dardır: birkaç saniyelik kayma orada sorun çıkarmazken burada tüm\n> imzalı istekleri reddettirir.\n\nAnahtar alma, izinler ve imzalama şemasının BtcTurk'ten farkları:\n[docs/credentials/binance-tr.md](https://github.com/erenemrearik/TRCrypto.Net/blob/main/docs/credentials/binance-tr.md)\n\n## Desteklenen uçlar\n\n| Uç | Metod | Durum |\n|---|---|---|\n| `/open/v1/common/time` | `GetServerTimeAsync` | ✅ |\n| `/open/v1/common/symbols` | `GetSymbolsAsync` | ✅ |\n| `/open/v1/market/depth` | `GetOrderBookAsync` | ✅ |\n| `/open/v1/market/agg-trades` | `GetAggregatedTradesAsync` | ✅ |\n| Ticker (REST) | yok | ❌ Anahtarsız mümkün değil |\n| Kline (REST) | yok | ⚠️ Borsa boş liste döndürüyor |\n| `/open/v1/account/spot` | `Account.GetAccountAsync` | ✅ |\n| `/open/v1/orders` (POST) | `Trading.PlaceOrderAsync` | ✅ |\n| `/open/v1/orders` (GET) | `Trading.GetOrdersAsync` | ✅ |\n| `/open/v1/orders/detail` | `Trading.GetOrderAsync` | ✅ |\n| `/open/v1/orders/cancel` | `Trading.CancelOrderAsync` | ✅ |\n| `/open/v1/orders/trades` | `Trading.GetUserTradesAsync` | ✅ |\n| WS ticker | `SubscribeToTickerUpdatesAsync` | ✅ |\n| WS trade · aggTrade | `SubscribeToTradeUpdatesAsync` vb. | ✅ |\n| WS emir defteri | `SubscribeToOrderBookUpdatesAsync` | ✅ |\n| WS kline | `SubscribeToKlineUpdatesAsync` | ✅ |\n| SharedApis (bakiye ve emir) | `IBalanceRestClient` · `ISpotOrderRestClient` | ✅ |\n| SharedApis (REST) | `ISpotSymbolRestClient` · `IOrderBookRestClient` · `IRecentTradeRestClient` | ✅ |\n| SharedApis (socket) | `ITickerSocketClient` · `ITradeSocketClient` · `IOrderBookSocketClient` · `IKlineSocketClient` | ✅ |\n\n## Bağımlılık enjeksiyonu\n\nTek çağrı hem REST hem WebSocket istemcisini kaydeder.\n\n```csharp\nbuilder.Services.AddTRCryptoBinanceTR();\n\npublic sealed class PriceService(IBinanceTRRestClient rest, IBinanceTRSocketClient socket)\n{\n    // Enjekte edilen istemcileri yeniden kullanın; socket istemcisi tekildir.\n}\n```\n\nResmi API belgeleri: [binance.tr/apidocs](https://www.binance.tr/apidocs)\n\n## Lisans\n\nMIT"},"anahtar-guvenlik":{"title":"Güvenlik kuralları","heading":"API Kimlik Bilgileri","source":"docs/credentials/README.md","body":"Bu klasör, TRCrypto ile bir Türk kripto borsasına bağlanmak için gereken API anahtarlarının\n**nasıl alınacağını, nasıl saklanacağını ve nasıl kullanılacağını** anlatır.\n\nİki okuyucu kitlesi için yazılmıştır:\n\n- **Kütüphaneyi kullanan geliştirici:** kendi hesabını kendi uygulamasına bağlayacak kişi\n- **TRCrypto'ya katkı veren geliştirici:** private endpoint testlerini çalıştıracak kişi\n\n| Borsa | Rehber | Durum |\n|---|---|---|\n| BtcTurk | [btcturk.md](#/anahtar-btcturk) | ✅ Hazır |\n| Binance TR | [binance-tr.md](#/anahtar-binance-tr) | ✅ Hazır (kimlik doğrulama henüz devre dışı) |\n| Paribu | `paribu.md` | ⏳ Adapter ile birlikte |\n| Bitexen | `bitexen.md` | ⏳ Faz 2 |\n\n---\n\n## Önce şunu bilin: çoğu şey için anahtar GEREKMEZ\n\nPiyasa verisi (fiyat, emir defteri, işlemler, pariteler) **herkese açıktır**. Bunlar için\nAPI anahtarı oluşturmanıza gerek yoktur:\n\n```csharp\nvar client = new BtcTurkRestClient();          // kimlik bilgisi yok\nvar ticker = await client.SpotApi.ExchangeData.GetTickerAsync(\"BTCTRY\");\n```\n\nAnahtar yalnızca **hesabınıza özel** işlemler için gerekir: bakiye görüntüleme, emir verme,\nemir iptali, işlem geçmişi.\n\n---\n\n## Altın kural: en az yetki (least privilege)\n\nBir API anahtarı, verdiğiniz izinlerin tamamını yapabilen bir vekildir. Anahtar sızarsa,\nverdiğiniz her izin saldırganın eline geçer.\n\n> ### ⚠️ Çekim (Withdrawal / Para Çekme) iznini AÇMAYIN\n>\n> TRCrypto hiçbir özelliği için çekim iznine ihtiyaç duymaz. Çekim izni olan bir anahtar\n> sızarsa **varlıklarınız geri alınamaz biçimde transfer edilebilir**. Sızan bir okuma\n> anahtarı can sıkıcıdır; sızan bir çekim anahtarı paranızı kaybettirir.\n\nYapmanız gereken:\n\n- Yalnızca ihtiyacınız olan izinleri işaretleyin\n- **IP allow-list'i mutlaka doldurun** ki anahtar başka bir IP'den kullanılamasın\n- Emir denemeleri için ana hesabınızı değil, **ayrı ve düşük bakiyeli bir hesap** kullanın\n- Anahtarları düzenli aralıklarla yenileyin\n- Farklı ortamlar (geliştirme / üretim) için **ayrı anahtarlar** kullanın\n\n---\n\n## Anahtarlarınızı nerede saklamalısınız\n\n### ❌ Asla\n\n- Kaynak koda gömmek (`new BtcTurkCredentials(\"abc123\", \"xyz\")`)\n- `appsettings.json` içine yazıp commit etmek\n- Slack/WhatsApp/e-posta ile göndermek\n- Ekran görüntüsü veya log çıktısı paylaşırken maskelememek\n\n> Bir secret git geçmişine bir kez girerse, dosyayı silmek yetmez, çünkü geçmişte kalır.\n> Tek doğru çözüm **anahtarı borsada iptal edip yenisini oluşturmaktır**.\n\n### ✅ Yerel geliştirmede: `dotnet user-secrets`\n\nDeğerler proje klasörünün **tamamen dışında**, kullanıcı profilinizde saklanır. Yanlışlıkla\ncommit etmeniz fiziksel olarak mümkün değildir.\n\n```bash\ncd tests/TRCrypto.BtcTurk.IntegrationTests\ndotnet user-secrets init\ndotnet user-secrets set \"BtcTurk:ApiKey\"    \"buraya-public-key\"\ndotnet user-secrets set \"BtcTurk:ApiSecret\" \"buraya-base64-secret\"\n```\n\nOkuma:\n\n```csharp\nvar config = new ConfigurationBuilder().AddUserSecrets<Program>().Build();\nvar credentials = new BtcTurkCredentials(\n    config[\"BtcTurk:ApiKey\"]!,\n    config[\"BtcTurk:ApiSecret\"]!);\n```\n\n### ✅ Alternatif: ortam değişkenleri / `.env`\n\n[`.env.example`](https://github.com/erenemrearik/TRCrypto.Net/blob/main/.env.example) dosyasını `.env` adıyla kopyalayıp doldurun.\n`.env` `.gitignore` tarafından bloklanmıştır; `.env.example` ise şablondur ve gerçek\ndeğer içermez.\n\n### ✅ CI ortamında: GitHub Actions Secrets\n\nRepository → Settings → Secrets and variables → Actions. Değerler ortam değişkeni olarak\ninject edilir; test kodu `IConfiguration` üzerinden okur, böylece yerel ve CI'da **aynı\nkod yolu** çalışır.\n\n### ✅ Üretimde\n\nAzure Key Vault, AWS Secrets Manager, HashiCorp Vault veya platformunuzun secret store'u.\n\n---\n\n## Uygulamaya bağlama (DI)\n\n```csharp\n// Tek çağrı hem REST hem WebSocket istemcisini kaydeder; kimlik bilgisi ikisine de uygulanır.\nbuilder.Services.AddTRCryptoBtcTurk(options =>\n{\n    options.ApiCredentials = new BtcTurkCredentials(\n        builder.Configuration[\"BtcTurk:ApiKey\"]!,\n        builder.Configuration[\"BtcTurk:ApiSecret\"]!);\n});\n\n// Kullanim: client yeniden kullanilabilir, her istek icin yenisini OLUSTURMAYIN\npublic sealed class PortfolioService(IBtcTurkRestClient client)\n{\n    public async Task<decimal?> GetTryBalanceAsync(CancellationToken ct = default)\n    {\n        var result = await client.SpotApi.Account.GetBalancesAsync(ct);\n        if (!result.Success)\n            return null;\n        return result.Data.FirstOrDefault(b => b.Asset == \"TRY\")?.Free;\n    }\n}\n```\n\n---\n\n## TRCrypto secret'inizi nasıl koruyor\n\n- `BtcTurkCredentials.ToString()` ham secret yerine **maskeli fingerprint** döndürür\n- Secret hiçbir log kaydına, exception mesajına veya telemetry alanına yazılmaz\n- İstek gövdesi loglandığında `X-Signature` ve secret alanları redaction'dan geçer\n- Bunlar birim testleriyle doğrulanır. Log çıktısı yakalanır ve ham secret'ın hiçbir\n  yerde geçmediği assert edilir\n\n---\n\n## Anahtarım sızdıysa ne yapmalıyım?\n\n1. **Derhal** borsanın panelinden anahtarı silin (dakikalar önemlidir)\n2. Hesap hareketlerinizi kontrol edin\n3. Yeni anahtar oluşturun, IP allow-list'i doldurun\n4. Sızıntı git geçmişindeyse: anahtar zaten iptal edildiği için geçmişi temizlemek\n   ikincil önceliktir, ama repo herkese açıksa `git filter-repo` ile temizleyin\n\n---\n\n## Sorun giderme\n\n| Belirti | Olası neden |\n|---|---|\n| İmza geçersiz / yetkisiz | Secret Base64 ise decode edilmemiş olabilir; anahtar/secret yer değiştirmiş olabilir |\n| İstek reddedildi, anahtar doğru | IP allow-list'te bulunduğunuz IP yok |\n| Zaman damgası hatası | Sistem saatiniz kaymış; NTP ile senkronize edin |\n| İzin hatası | Anahtarda ilgili izin işaretli değil |\n| Bakiye boş dönüyor | Anahtar farklı bir hesaba ait olabilir |"},"anahtar-btcturk":{"title":"BtcTurk rehberi","heading":"BtcTurk API Anahtarı Alma ve Bağlama Rehberi","source":"docs/credentials/btcturk.md","body":"> **Kaynak:** [docs.btcturk.com/docs/api-access-permissions](https://docs.btcturk.com/docs/api-access-permissions) ·\n> [authentication-v1](https://docs.btcturk.com/docs/authentication/authentication-v1)\n> **Erişim tarihi:** 24 Ağustos 2026\n>\n> Genel güvenlik kuralları için önce [README.md](#/anahtar-guvenlik) dosyasını okuyun.\n\n## 0. Önce: anahtara ihtiyacınız var mı?\n\n**Muhtemelen hayır.** TRCrypto.BtcTurk'ün bu sürümü yalnızca herkese açık piyasa verisi sunar\nve bunun için anahtar gerekmez:\n\n```csharp\nvar client = new BtcTurkRestClient();   // kimlik bilgisi yok\nvar info = await client.SpotApi.ExchangeData.GetExchangeInfoAsync();\n```\n\nAnahtar yalnızca bakiye görüntüleme, emir verme/iptal ve işlem geçmişi için gerekir.\nBu özellikler henüz eklenmedi.\n\n---\n\n## 1. Anahtar nasıl oluşturulur\n\n1. [btcturk.com](https://www.btcturk.com) hesabınıza giriş yapın\n2. **Hesap → API Erişimi** sayfasına gidin\n3. Formda:\n   - Vereceğiniz **izinleri** seçin (bkz. bölüm 2)\n   - İstemcinizin çalışacağı **IP adresini** girin (bkz. bölüm 3)\n   - WebSocket erişimi gerekiyorsa ilgili seçeneği işaretleyin\n4. Formu gönderin. Size bir **public key** ve bir **private key (secret)** verilir\n\n> **Secret yalnızca bir kez gösterilir.** Kaybederseniz yeni anahtar oluşturmanız gerekir.\n> Kopyaladıktan sonra doğrudan bölüm 4'teki yönteme kaydedin.\n\n---\n\n## 2. İzinler ve en az yetki eşleşmesi\n\nBtcTurk dört izin tanımlar:\n\n| İzin (panelde) | Kapsam |\n|---|---|\n| **Toplam Varlık** (Total Funds) | Bakiye uçları |\n| **Al-Sat** (Trade) | Emir oluşturma ve iptal |\n| **Hesap** (Account) | İşlem geçmişi |\n| **WebSocket** | Socket mesajları |\n\nTRCrypto özelliklerine göre gerekli minimum:\n\n| Ne yapacaksınız | Gereken izinler |\n|---|---|\n| Fiyat, parite ve emir defteri okuma | **Hiçbiri; anahtar bile gerekmez** |\n| Bakiye görüntüleme | Toplam Varlık |\n| Emir geçmişi görüntüleme | Toplam Varlık + Hesap |\n| Emir verme / iptal | + Al-Sat |\n| Gerçek zamanlı özel akışlar | + WebSocket |\n\n> ### ⚠️ Çekim (Para Çekme) iznini AÇMAYIN\n>\n> TRCrypto hiçbir özelliği için çekim iznine ihtiyaç duymaz. Çekim izinli bir anahtar\n> sızarsa varlıklarınız geri alınamaz şekilde transfer edilebilir.\n\n**Emir testleri için:** ana hesabınızı kullanmayın. Ayrı, düşük bakiyeli bir hesap açın.\nTest emirlerini piyasadan çok uzak bir limit fiyatıyla verip hemen iptal edin.\n\n---\n\n## 3. IP allow-list\n\nAnahtar oluştururken IP girmek formun bir parçasıdır. Bu, anahtar sızsa bile başka bir\nmakineden kullanılmasını engeller ve **en etkili tek korumadır.**\n\n| Ortam | Ne yazmalı |\n|---|---|\n| Yerel geliştirme | Genel IP'niz (`curl ifconfig.me`) |\n| CI (GitHub Actions) | Runner IP'leri sabit değildir; kendi runner'ınızı kullanın veya CI'da private test çalıştırmayın |\n| Üretim | Sunucunuzun sabit çıkış IP'si |\n\nDinamik IP'niz varsa IP değiştiğinde anahtarı güncellemeniz gerekir.\n\n---\n\n## 4. Anahtarı uygulamaya bağlama\n\n### Saklama (önerilen: user-secrets)\n\n```bash\ncd <projeniz>\ndotnet user-secrets init\ndotnet user-secrets set \"BtcTurk:ApiKey\"    \"public-key-degeriniz\"\ndotnet user-secrets set \"BtcTurk:ApiSecret\" \"secret-degeriniz\"\n```\n\n### Kullanım\n\n```csharp\nusing TRCrypto.BtcTurk;\nusing TRCrypto.BtcTurk.Clients;\n\nvar client = new BtcTurkRestClient(options =>\n{\n    options.ApiCredentials = new BtcTurkCredentials(\n        configuration[\"BtcTurk:ApiKey\"]!,\n        configuration[\"BtcTurk:ApiSecret\"]!);\n});\n```\n\n### Bağımlılık enjeksiyonu ile\n\n```csharp\n// Tek çağrı hem REST hem WebSocket istemcisini kaydeder; kimlik bilgisi ikisine de uygulanır.\nbuilder.Services.AddTRCryptoBtcTurk(options =>\n{\n    options.ApiCredentials = new BtcTurkCredentials(\n        builder.Configuration[\"BtcTurk:ApiKey\"]!,\n        builder.Configuration[\"BtcTurk:ApiSecret\"]!);\n});\n```\n\n---\n\n## 5. Secret formatı: en sık yapılan hata\n\nBtcTurk'ün secret'ı **Base64 kodludur.** İmzalama sırasında ham metin olarak değil,\n**çözülmüş baytlar** HMAC anahtarı olarak kullanılır.\n\nTRCrypto bu çözümü sizin için yapar. Secret'ı **olduğu gibi**, panelde gördüğünüz haliyle\nverin. Kendiniz decode etmeye çalışmayın.\n\nİmza zinciri (referans):\n\n```\n1. mesaj    = apiKey + stamp          (stamp: UTC milisaniye)\n2. anahtar  = Base64Decode(secret)\n3. digest   = HMAC-SHA256(anahtar, mesaj)\n4. X-Signature = Base64Encode(digest)\n```\n\n2. adım atlanırsa imza **sessizce yanlış** olur. Hata mesajı \"geçersiz imza\" der ve\nnedeni belli olmaz.\n\nGönderilen başlıklar: `X-PCK` (public key), `X-Stamp` (nonce), `X-Signature`.\n\n---\n\n## 6. Sistem saatiniz doğru olmalı\n\n`X-Stamp` UTC milisaniye cinsindendir ve sunucu saatiyle uyumlu olmalıdır. Saatiniz\nkaymışsa istekleriniz reddedilir.\n\nKontrol:\n\n```csharp\nvar serverTime = await client.SpotApi.ExchangeData.GetServerTimeAsync();\nConsole.WriteLine($\"Fark: {(DateTime.UtcNow - serverTime.Data).TotalSeconds:F1} sn\");\n```\n\nBirkaç saniyenin üzerinde bir fark varsa Windows'ta\n**Ayarlar → Saat ve dil → Tarih ve saat → Şimdi eşitle** ile düzeltin.\n\n---\n\n## 7. Sorun giderme\n\n| Belirti | Neden / çözüm |\n|---|---|\n| İmza geçersiz | Secret ile public key yer değiştirmiş olabilir; ya da secret kopyalanırken boşluk/satır sonu eklenmiş |\n| Yetkisiz, anahtar doğru | Bulunduğunuz IP allow-list'te değil |\n| Zaman damgası hatası | Sistem saati kaymış (bölüm 6) |\n| İzin hatası | İlgili izin anahtarda işaretli değil; anahtarı yeniden oluşturun |\n| Bakiye boş | Anahtar farklı bir hesaba ait |\n| HTTP 503 (emir defteri) | Borsa tarafında geçici gecikme; yeniden deneyin |\n\n---\n\n## 8. Anahtarım sızdıysa\n\n1. **Derhal** Hesap → API Erişimi sayfasından anahtarı silin; resmi talimat budur\n2. Hesap hareketlerinizi kontrol edin\n3. Yeni anahtar oluşturun ve IP allow-list'i doldurun"},"anahtar-binance-tr":{"title":"Binance TR rehberi","heading":"Binance TR API Anahtarı Alma ve Bağlama Rehberi","source":"docs/credentials/binance-tr.md","body":"> **Kaynak:** [binance.tr/apidocs](https://www.binance.tr/apidocs) · panel akışı Binance TR\n> hesap arayüzünden doğrulanmıştır\n> **Erişim tarihi:** 27 Ağustos 2026\n>\n> Genel güvenlik kuralları için önce [README.md](#/anahtar-guvenlik) dosyasını okuyun.\n\n## 0. Önce: anahtara ihtiyacınız var mı?\n\n**Bu sürümde anahtar hiçbir işe yaramaz.** `TRCrypto.BinanceTR` şu an yalnızca kimlik\ndoğrulama gerektirmeyen uçları sunuyor; imzalama yazıldı ama **canlı doğrulanmadığı için\nbilinçli olarak devre dışıydı.** Doğrulanmamış bir imzalama, isteklerin nedeni belirsiz\nşekilde reddedilmesine yol açardı.\n\n```csharp\nvar rest   = new BinanceTRRestClient();     // kimlik bilgisi yok\nvar socket = new BinanceTRSocketClient();   // kimlik bilgisi yok\n\nvar book = await rest.SpotApi.ExchangeData.GetOrderBookAsync(\"BTC_TRY\", limit: 5);\nawait socket.SpotApi.SubscribeToTickerUpdatesAsync(\"BTC_TRY\", u => Console.WriteLine(u.Data.LastPrice));\n```\n\n> [!IMPORTANT]\n> **Ticker verisi için anahtar almanız gerekmez.** Borsa REST tarafında ticker'ı anahtarsız\n> vermiyor, ama aynı veri **WebSocket üzerinden anahtarsız akıyor**. Yalnızca fiyat takibi\n> yapacaksanız anahtar almanıza gerek yok.\n\nAnahtar yalnızca bakiye, emir ve hesap uçları eklendiğinde gerekli olacak.\n\n---\n\n## 1. Anahtar nasıl oluşturulur\n\n1. [binance.tr](https://www.binance.tr) hesabınıza giriş yapın\n2. Sağ üstteki hesap simgesinden **API Yönetimi** sayfasına gidin\n3. Anahtara bir **isim** verin ve güvenlik doğrulamasını tamamlayın\n4. Oluşturma isteği borsanın onayına düşer\n5. Onaydan sonra **İzinleri düzenle** ile izinleri ve IP kısıtlamasını ayarlayın\n\n> **Secret yalnızca bir kez gösterilir.** Kopyaladıktan sonra doğrudan bölüm 4'teki\n> yönteme kaydedin; kaybederseniz yeni anahtar oluşturmanız gerekir.\n\n> [!NOTE]\n> Anahtar oluşturabilmek için hesabınızın kimlik doğrulaması tamamlanmış olmalıdır.\n\n---\n\n## 2. İzinler ve en az yetki eşleşmesi\n\nResmi dokümantasyon uçları üç güvenlik seviyesine ayırır:\n\n| Seviye | Ne gerekir |\n|---|---|\n| `NONE` | Hiçbir şey; herkese açık uçlar |\n| `API_KEY` | Yalnızca `X-MBX-APIKEY` başlığı |\n| `SIGNED` | Anahtar **ve** HMAC-SHA256 imzası |\n\nPanel tarafında verilecek izinler için kural nettir:\n\n| Amaç | Açılacak izin | Kapalı kalacak |\n|---|---|---|\n| Piyasa verisi okuma | **hiçbiri**, anahtar bile gerekmez | hepsi |\n| Bakiye ve hesap okuma | okuma izni | alım satım, **çekim** |\n| Emir verme / iptal | alım satım | **çekim** |\n\n> [!WARNING]\n> **Çekim (withdrawal) iznini açmayın.** TRCrypto çekim işlemi yapmaz; bu izne hiçbir\n> özellik için ihtiyaç duyulmaz. Açıldığında anahtarınız sızarsa varlıklarınız\n> doğrudan risk altındadır.\n\nEmir testleri yapacaksanız bunları **ayrı ve düşük bakiyeli** bir hesapta yapın.\n\n---\n\n## 3. IP kısıtlaması\n\n**İzinleri düzenle** ekranındaki **\"Erişimi yalnızca güvenilir IP adresleriyle sınırla\"**\nseçeneğini işaretleyin ve istemcinizin çıkış IP'sini girin.\n\n| Ortam | Ne yazılır |\n|---|---|\n| Yerel geliştirme | Kendi genel IP'niz (`curl ifconfig.me`) |\n| Sunucu / VPS | Sunucunun sabit çıkış IP'si |\n| GitHub Actions | Sabit IP yok; CI'da imzalı istek çalıştırmayın |\n\nEv bağlantınızın IP'si değişebilir; \"yetkisiz\" hatası alıp izinleri doğru sanıyorsanız\nilk bakılacak yer burasıdır.\n\n---\n\n## 4. Anahtarı uygulamaya bağlama\n\n### Saklama (önerilen: user-secrets)\n\nDeğerler repo dizininin **tamamen dışında**, `%APPDATA%\\Microsoft\\UserSecrets\\` altında durur:\n\n```bash\ncd tests/TRCrypto.BinanceTR.IntegrationTests\ndotnet user-secrets set \"BinanceTR:ApiKey\"    \"...\"\ndotnet user-secrets set \"BinanceTR:ApiSecret\" \"...\"\n```\n\nAnahtarı **asla** kaynak koda, `appsettings.json`'a veya bir ortam dosyasına yazmayın.\n\n### Bağımlılık enjeksiyonu ile\n\n```csharp\n// Tek çağrı hem REST hem WebSocket istemcisini kaydeder; kimlik bilgisi ikisine de uygulanır.\nbuilder.Services.AddTRCryptoBinanceTR(options =>\n{\n    options.ApiCredentials = new BinanceTRCredentials(\n        builder.Configuration[\"BinanceTR:ApiKey\"]!,\n        builder.Configuration[\"BinanceTR:ApiSecret\"]!);\n});\n```\n\n---\n\n## 5. Secret formatının BtcTurk'ten farkı\n\n| | BtcTurk | Binance TR |\n|---|---|---|\n| Secret | **Base64**, imzalamadan önce çözülür | **Ham metin**, çözülmez |\n| İmza kodlaması | Base64 | **Onaltılık (hex)** |\n| Başlık | `X-PCK` · `X-Stamp` · `X-Signature` | `X-MBX-APIKEY` + `signature` parametresi |\n\nİki borsanın imzalama şeması birbirine benzemez. Aynı yardımcı kodu ikisinde de\nkullanmaya çalışmak sessizce yanlış imza üretir.\n\nTRCrypto her iki dönüşümü de sizin için yapar. Secret'ı **panelde gördüğünüz haliyle**\nverin.\n\n---\n\n## 6. Sistem saatiniz doğru olmalı\n\nİmzalı isteklerde `timestamp` (milisaniye) zorunludur. Borsa isteği yalnızca\n`recvWindow` içinde kabul eder: **varsayılan 5000 ms**, en fazla 60000 ms.\n\n> [!WARNING]\n> Bu pencere BtcTurk'e göre dardır. Birkaç saniyelik bir saat kayması BtcTurk'te sorun\n> çıkarmazken Binance TR'de **tüm imzalı istekleri reddettirir**.\n\nKontrol:\n\n```csharp\nvar serverTime = await rest.SpotApi.ExchangeData.GetServerTimeAsync();\nConsole.WriteLine($\"Fark: {(DateTime.UtcNow - serverTime.Data).TotalMilliseconds:N0} ms\");\n```\n\nWindows'ta düzeltme: **Ayarlar → Saat ve dil → Tarih ve saat → Şimdi eşitle**.\nEtki alanına bağlı makinelerde saat etki alanı denetleyicisinden gelir; kayma\nsürüyorsa çözüm sistem yöneticisindedir.\n\n---\n\n## 7. Sorun giderme\n\n| Belirti | Neden / çözüm |\n|---|---|\n| `3701 Invalid API-key, IP, or permissions` | Üç ayrı nedeni tek mesajda toplar: anahtar yanlış, IP listede değil veya izin işaretli değil. **`/api/v3/*` yollarında ise anahtarınız değil, yol yanlıştır**; aşağıdaki nota bakın |\n| Zaman damgası / `recvWindow` hatası | Sistem saati kaymış (bölüm 6) |\n| İmza geçersiz | Secret'ı Base64 çözmeye çalışmış olabilirsiniz; Binance TR'de çözülmez (bölüm 5) |\n| `1106 Incorrect Page number` | Emir defteri kademe sayısı desteklenmiyor; yalnızca 5, 10, 20, 50, 100, 500, 1000 kabul edilir. Mesaj sorunun limit olduğunu söylemez |\n| İşlem/mum listesi boş ama `code: 0` | Borsa bu REST uçlarını boş döndürüyor; veri WebSocket üzerinden gelir |\n| HTTP 429 / 418 | İstek limiti aşıldı; 418 IP yasağıdır ve süresi tekrarla uzar |\n\n> [!NOTE]\n> Global Binance'te herkese açık olan `/api/v3/*` uçları Binance TR'de **anahtar ister**.\n> Global Binance için yazılmış örnek kod burada çalışmaz. Kullanılacak yollar\n> `/open/v1/...` altındadır.\n\n---\n\n## 8. Anahtarım sızdıysa\n\n1. **Derhal** API Yönetimi sayfasından anahtarı silin\n2. Hesap hareketlerinizi ve açık emirlerinizi kontrol edin\n3. Yeni anahtar oluşturun, izinleri en aza indirin ve IP kısıtlamasını doldurun\n\n---\n\n## Ayrıca\n\n- Borsanın uç envanteri: [../vendor/binance-tr-capabilities.md](#/vendor-binance-tr)\n- WebSocket protokolü: [../vendor/binance-tr-websocket.md](#/vendor-binance-tr-ws)"},"vendor-btcturk":{"title":"BtcTurk uç envanteri","heading":"BtcTurk: Vendor Capability Freeze","source":"docs/vendor/btcturk-capabilities.md","body":"> **Story:** BTC-001 · **Erişim tarihi:** 24 Ağustos 2026\n> **Kaynak:** https://docs.btcturk.com/ (resmi dokümantasyon)\n>\n> Bu dosya kopyalanmış tam doküman **değildir**; kaynak linkli bir envanterdir (spesifikasyon Bölüm 17.3).\n> ADR-010 uyarınca **yalnızca resmi dokümantasyon source-of-truth'tur**. Üçüncü taraf wrapper'lar\n> (ccxt, arşivlenmiş `BtcTurk.Net`) yalnızca keşif amaçlı kullanılabilir, kontrat kaynağı değildir.\n\n## Genel\n\n| Alan | Değer |\n|---|---|\n| Base URL | `https://api.btcturk.com` |\n| Public API sürümü | v2 |\n| Private API sürümü | v1 |\n| Durum sayfası | https://status.btcturk.com/ |\n| İstek sembol formatı | `BTCTRY`; birleşik, büyük harf, ayırıcı **yok** |\n| Zaman damgası | **milisaniye** (OHLC hariç) |\n| OHLC zaman damgası | **saniye** |\n| Content-Type | Auth gerektiren isteklerde `application/json` |\n| Parametre sırası | Serbest |\n\n### Yanıt zarfı (envelope)\n\nTüm endpoint'ler şu yapıyı döndürür:\n\n```json\n{ \"success\": true, \"message\": null, \"code\": 0, \"data\": { } }\n```\n\n> ⚠️ **Kritik 1:** `success` HTTP 200 içinde `false` olabilir. İş mantığı hatası HTTP durum\n> koduna yansımaz. Bu nedenle `success == false` durumu `HttpResult.Success == false` olarak\n> yüzeye çıkarılmalıdır (spesifikasyon Bölüm 10.5).\n>\n> ⚠️ **Kritik 2: `code` alanının tipi uçlar arasında tutarsızdır.**\n>\n> | Uç | `code` değeri |\n> |---|---|\n> | exchangeinfo, ticker, trades | `0`, **sayı** |\n> | **orderbook** | `\"SUCCESS\"`, **metin** |\n>\n> Alanı `int` olarak modellemek emir defteri çağrılarını deserialization hatasıyla kırar.\n> Bu davranış resmi dokümantasyonda **geçmez**; canlı API ile tespit edilmiştir.\n> Değer metin olarak taşınır.\n>\n> ⚠️ **Kritik 3:** Başarılı yanıtlarda `message` alanı `null` değil **boş string** döner.\n\n## Public Endpoint'ler\n\n| # | Method | Path | Parametreler | MVP eşlemesi |\n|---|---|---|---|---|\n| 1 | GET | `/api/v2/server/exchangeinfo` | yok | `ISpotSymbolRestClient` + server time |\n| 2 | GET | `/api/v2/ticker` | `pairSymbol` (ops.) | `ISpotTickerRestClient` |\n| 3 | GET | `/api/v2/ticker/currency` | `symbol` (ör. `usdt`) | native |\n| 4 | GET | `/api/v2/orderbook` | `pairSymbol` (zor.), `limit` (ops., varsayılan **25**) | `IOrderBookRestClient` |\n| 5 | GET | `/api/v2/trades` | `pairSymbol` (zor.), `last` (ops., **max 50**) | `IRecentTradeRestClient` |\n| 6 | GET | OHLC / kline | ⏳ PR-002'de doğrulanacak | `IKlineRestClient` |\n\n### 1: Exchange Info\n\n`GET /api/v2/server/exchangeinfo` · parametresiz\n\n`data` alanları:\n\n- `timeZone`: `\"UTC\"`\n- `serverTime`: Unix ms (ör. `1641916253216`)\n- `symbols[]`: parite listesi\n- `currencies[]`: varlık bilgisi (`minWithdrawal`, `minDeposit`, `precision`, yatırma/çekme durum bayrakları)\n\n`symbols[]` öğe alanları:\n\n| Alan | Açıklama |\n|---|---|\n| `id` | Sayısal parite kimliği |\n| `name` | `\"BTCTRY\"`, native sembol |\n| `nameNormalized` | `\"BTC_TRY\"` |\n| `numerator` ve `denominator` | **`\"BTC\"`** ve **`\"TRY\"`**; base ve quote varlık ayrı alanlarda |\n| `numeratorScale` / `denominatorScale` | Ondalık hassasiyet |\n| `status` | `\"TRADING\"` |\n| `hasFraction` | bool |\n| `filters[]` | `PRICE_FILTER`: `minPrice`, `maxPrice`, `tickSize`, `minExchangeValue` |\n| `orderMethods[]` | `MARKET`, `LIMIT`, `STOP_MARKET`, `STOP_LIMIT` |\n| `displayFormat` | Sayı biçimi deseni |\n| `commissionFromNumerator` | bool |\n| `order` | Görüntüleme sırası |\n| `priceRounding`, `isNew` | bool |\n| `marketPriceWarningThresholdPercentage` | decimal |\n\n> ✅ **`serverTime` bu yanıtın içindedir.** Ayrı bir server-time ucuna ihtiyaç yoktur.\n> `GetServerTimestampAsync()` bu endpoint üzerinden karşılanır.\n>\n> ✅ **`numerator`/`denominator` ayrı alan olarak gelir.** `SharedSymbol` eşlemesi bu alanlardan\n> yapılır; sembol string'i **ayrıştırılmaz**. Bu, RISK-05'i (TL/TRY alias) ortadan kaldırır.\n\n### 4: Order Book\n\n`GET /api/v2/orderbook?pairSymbol=BTCTRY&limit=25`\n\n```json\n{ \"success\": true, \"message\": null, \"code\": 0,\n  \"data\": { \"timestamp\": 1543836448605,\n            \"bids\": [[\"33245.00\",\"2.10695265\"], [\"33209.00\",\"0.001\"]],\n            \"asks\": [[\"33490.00\",\"0.03681877\"]] } }\n```\n\n`bids` ve `asks`: `[fiyat, miktar]`. Her ikisi de **metin** gelir ve `decimal` değere dönüştürülür.\n\n> ⚠️ Gerçek zamanlı veride gecikme/arıza durumunda bu endpoint **HTTP 503** döndürür.\n> Geçici hata olarak sınıflandırılmalıdır (`IsTransient`).\n\n### 5: Trades\n\n`GET /api/v2/trades?pairSymbol=BTCUSDT&last=30` · `last` max **50** (istemci tarafında doğrulanır)\n\n```json\n{ \"success\": true, \"message\": null, \"code\": 0,\n  \"data\": [{ \"pair\": \"BTCTRY\", \"pairNormalized\": \"BTC_TRY\",\n             \"numerator\": \"BTC\", \"denominator\": \"TRY\",\n             \"date\": 1533650242300, \"tid\": \"636692470417865271\",\n             \"price\": \"33490\", \"amount\": \"0.00032747\" }] }\n```\n\n## Authentication (M2: henüz implement edilmedi)\n\nKaynak: `docs.btcturk.com/docs/authentication/authentication-v1`\n\n| Header | İçerik |\n|---|---|\n| `X-PCK` | API public key |\n| `X-Stamp` | Nonce; UTC **milisaniye** |\n| `X-Signature` | HMAC-SHA256 imza |\n\n**İmza zinciri:**\n\n1. Mesaj = `apiKey + stamp` (string birleştirme)\n2. Secret **Base64 decode** edilir → HMAC anahtarı\n3. `HMAC-SHA256(decodedSecret, mesaj)` → ham digest\n4. Digest **Base64 encode** edilir → `X-Signature`\n\n> ⚠️ 2. adım (Base64 decode) atlanırsa imza **sessizce yanlış** olur. En sık yapılan hata budur;\n> deterministic test vector ile doğrulanması zorunludur.\n\nSunucu saati UTC ms ile senkron olmalıdır; kayma durumunda istekler reddedilir.\n\n### API key izinleri\n\nPanel: **Hesap > API Erişimi**. Key oluştururken IP adresi girişi form'un parçasıdır.\n\n| İzin | Kapsam |\n|---|---|\n| Total Funds (Toplam Varlık) | Bakiye uçları |\n| Trade (Al-Sat) | Emir işlemleri |\n| Account (Hesap) | İşlem geçmişi |\n| WebSocket | Socket mesajları |\n\nDetaylı rehber: [`docs/credentials/btcturk.md`](#/anahtar-btcturk)\n\n### 2: Ticker\n\n`GET /api/v2/ticker` (tüm pariteler) · `?pairSymbol=BTCTRY` (tek parite; **yine dizi döner**)\n\nAlanlar: `pair`, `pairNormalized`, `numeratorSymbol`, `denominatorSymbol`, `timestamp` (ms),\n`last`, `high`, `low`, `bid`, `ask`, `open`, `volume`, `average`, `daily`, `dailyPercent`, `order`.\n\n> ⚠️ Sayısal alanlar bu uçta **sayı** olarak gelir (trades ucunda **metin** olarak gelir).\n>\n> ⚠️ Base/quote alan adları bu uçta `numeratorSymbol`/`denominatorSymbol` iken trades ucunda\n> `numerator`/`denominator`'dur. İsimlendirme uçlar arasında tutarlı değildir.\n>\n> ⚠️ Tek parite istendiğinde de **dizi** döner; boş dizi bilinmeyen sembol anlamına gelir.\n\n### 5: Trades (ek alan)\n\nCanlı yanıt, resmi örnekte bulunmayan bir **`side`** alanı içerir (`\"buy\"` / `\"sell\"`).\n\n## İstek Limitleri\n\nKaynak: `docs.btcturk.com/docs/private-endpoints/rate-limits/`. IP bazlıdır, 24 Ağu 2026.\n\n| Uç | Limit |\n|---|---|\n| Ticker | 600 / 60 sn |\n| Order book | 180 / 60 sn |\n| OHLC | 120 / 60 sn |\n| Graph API | 600 / 10 dk |\n| Bakiye (private) | 120 / 60 sn |\n| Emir POST/DELETE (private) | 300 / 60 sn + 10 / 1 sn |\n| Emir GET tekil (private) | 900 / 60 sn + 30 / 1 sn |\n| WebSocket bağlantı | 15 / dk (aşımda 60 sn engel) |\n\nKütüphane şu an en kısıtlayıcı public limiti (180/60 sn) genel tavan olarak uygular;\nuç bazlı ince ayar ilgili uçlar eklendikçe yapılacaktır.\n\n## Private Endpointler\n\nHepsi `X-PCK` + `X-Stamp` + `X-Signature` başlıklarını gerektirir.\n\n| # | Method | Path | Durum |\n|---|---|---|---|\n| 1 | GET | `/api/v1/users/balances` | ✅ Uygulandı |\n| 2 | GET | `/api/v1/openOrders?pairSymbol=` | ✅ Uygulandı |\n| 3 | GET | `/api/v1/allOrders` | ✅ Uygulandı |\n| 4 | GET | `/api/v1/order/{orderId}` | ✅ Uygulandı |\n| 5 | POST | `/api/v1/order` | ✅ Uygulandı |\n| 6 | DELETE | `/api/v1/order?id=` | ✅ Uygulandı |\n| 7 | GET | `/api/v1/users/transactions/trade` | ✅ Uygulandı |\n\n### 1: Account Balance\n\n`GET /api/v1/users/balances` · parametresiz · izin: **Toplam Varlık**\n\nAlanlar: `asset`, `assetname`, `balance`, `locked`, `free`, `orderFund`, `requestFund`,\n`precision`, `timestamp` (ms).\n\n> ### ⚠️ Kritik 4: dokümantasyondaki ondalık örneği YANILTICI\n>\n> Resmi dokümantasyon bakiye tutarlarını **virgül** ayırıcılı gösterir:\n> `\"balance\": \"27223,7283250757643288\"`\n>\n> **Canlı API nokta kullanıyor.** 26 Ağustos 2026'da gerçek bir hesaba karşı ölçüldü:\n> yanıttaki ondalıklı alanların tamamı nokta ayırıcılıydı, virgüllü tek alan yoktu.\n>\n> Kütüphane yine de her iki ayırıcıyı kabul eder (`BtcTurkDecimalConverter`). Bunu\n> kaldırmadık: dokümantasyon virgül vaat ettiğine göre bazı hesap/ortam koşullarında\n> virgül dönme ihtimali var ve yanlış yorumlanan bir bakiye kat kat büyük görünür.\n> Belirsizlik yoktur, çünkü BtcTurk binlik ayırıcı kullanmaz; dolayısıyla virgül her zaman\n> ondalık ayırıcıdır.\n\n### 2: Open Orders\n\n`GET /api/v1/openOrders?pairSymbol=BTCTRY` · izin: **Toplam Varlık**\n\nYanıt `asks` ve `bids` olarak iki listeye ayrılır. Emir alanları: `id`, `price`, `amount`,\n`quantity`, `stopPrice`, `pairSymbol`, `type`, `method`, `orderClientId`, `updateTime`,\n`status`, `leftAmount`. Ondalıklar **nokta** ayırıcılıdır (`\"0.09733687\"`).\n\n### 3: Submit Order\n\n`POST /api/v1/order` · izin: **Al-Sat**\n\n| Parametre | Tip | Zorunlu |\n|---|---|---|\n| `quantity` | number | Evet |\n| `price` | number | Limit emirlerde |\n| `orderMethod` | `limit` · `market` · `stoplimit` · `stopmarket` | Evet |\n| `orderType` | `buy` · `sell` | Evet |\n| `pairSymbol` | string | Evet |\n| `stopPrice` | number | Stop emirlerde |\n| `newOrderClientId` | string | Hayır |\n\nDokümantasyon ondalık ayırıcı olarak **nokta** kullanılmasını açıkça belirtir.\nPiyasa emirlerinde `price` yok sayılır (%5 tolerans).\n\n> ⚠️ Emir uçları gerçek para hareketi yaratır. ADR-009 uyarınca bu uçlarda otomatik\n> yeniden deneme **yapılmaz**.\n\n### 4: Cancel Order\n\n`DELETE /api/v1/order?id=123456789` · izin: **Al-Sat**\n\n```json\n{ \"success\": true, \"message\": \"SUCCESS\", \"code\": \"\", \"data\": {} }\n```\n\n> ### ⚠️ Kritik 5: başarılı yanıt iptalin tamamlandığı anlamına GELMEZ\n>\n> Resmi dokümantasyon: istek alındığında HTTP 200 döner, ancak *\"finalization of the\n> cancellation request is sent through WebSocket channel 452\"*. Yani kesinleşme WebSocket\n> üzerinden duyurulur.\n>\n> Emrin gerçekten iptal edildiğini varsaymak yerine durumu ayrıca sorgulayın.\n> Bu davranış `CancelOrderAsync` XML dokümantasyonunda da uyarı olarak yer alır.\n>\n> Ayrıca bu uçta `code` alanı **boş metin** döner ve `int` beklemek burada da kırılır.\n\n### 5: Get Single Order\n\n`GET /api/v1/order/{orderId}`. Emir kimliği **yolda** taşınır, sorgu dizesinde değil.\nEmir bulunamazsa HTTP 400 döner.\n\n> ⚠️ Alan adları uçlar arasında tutarsızdır:\n>\n> | Kavram | open orders | all orders | single order | submit order |\n> |---|---|---|---|---|\n> | Sembol | `pairsymbol` | `pairsymbol` | `pairSymbol` | `pairSymbol` |\n> | Normalize ad | yok | `pairsymbolnormalized` | `pairSymbolNormalized` | `pairSymbolNormalized` |\n> | Oluşturulma | `time` | `time` | `time` | **`datetime`** |\n> | İstemci kimliği | `orderClientId` | `orderClientId` | `orderClientId` | **`newOrderClientId`** |\n>\n> Büyük/küçük harf farkları ayrıştırmada sorun çıkarmaz; `time`/`datetime` ve\n> `orderClientId`/`newOrderClientId` farkları ise ayrı model gerektirir.\n>\n> ⚠️ Emir yöntemi yazımı da farklıdır: `exchangeinfo` **`STOP_MARKET`** verirken emir\n> uçları **`stopmarket`** veriyor. Enum eşlemesi her iki biçimi de tanımalıdır.\n\n## Kimlik Doğrulama Test Vektörü\n\nResmi dokümantasyon test vektörü yayınlamaz. Algoritmanın bağımsız bir uygulamasıyla\nüretilen ve birim testlerinde kullanılan vektör (kimlik bilgileri **sahtedir**):\n\n| Alan | Değer |\n|---|---|\n| apiKey | `test-public-key` |\n| secret | `dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3Rz` |\n| stamp | `1735689600000` |\n| **imza** | `7gyFGcOS+qnq46h/rl83VtpaEAsh8Th3Z3lQrF7g2I0=` |\n\nBase64 decode adımı atlanırsa imza `38qSfoys8cvFpd0FBe50RUaqT6Dl3iMO7iyblkzlqnw=` olur;\nsessizce yanlış, ama borsa yalnızca genel bir kimlik doğrulama hatası döndürür.\n\n\n## Henüz Dondurulmamış Alanlar\n\nAşağıdakiler ilgili story açılırken resmi dokümandan doğrulanacaktır:\n\n- `GET /api/v2/ticker/currency` yanıt şeması (uygulandı, canlı doğrulaması yapılmadı)\n- Emir defteri `limit` parametresinin üst sınırı (dokümante edilmemiş)\n- Rate limit değerleri (`private-endpoints/rate-limits`)\n- Hata kodları (`error-handling/*`)\n- WebSocket protokolü (`websocket-feed/*`): kanal, olay ve model yapısı\n\n## Kaynak Sayfaları\n\nEnvanter şu sayfalardan çıkarılmıştır (24 Ağu 2026):\n\n- `docs.btcturk.com/docs/general-information`\n- `docs.btcturk.com/docs/public-endpoints/exchange-info/`\n- `docs.btcturk.com/docs/public-endpoints/ticker/`\n- `docs.btcturk.com/docs/public-endpoints/orderbook/`\n- `docs.btcturk.com/docs/public-endpoints/trades/`\n- `docs.btcturk.com/docs/api-access-permissions`\n- `docs.btcturk.com/docs/authentication/authentication-v1`"},"vendor-btcturk-kline":{"title":"BtcTurk kline ve işlemler","heading":"BtcTurk: Kline ve Kullanıcı İşlem Geçmişi","source":"docs/vendor/btcturk-kline-and-trades.md","body":"> **Erişim tarihi:** 25 Ağustos 2026\n> Ana envanter: [btcturk-capabilities.md](#/vendor-btcturk)\n>\n> Bu iki uç, ana envanterden ayrı tutulmuştur çünkü ikisi de ortak kalıbın dışına çıkar.\n\n---\n\n## Kline / OHLC: ayrı host, ayrı format\n\n`GET https://graph-api.btcturk.com/v1/klines/history`\n\n> ### ⚠️ Kritik 6: bu uç diğerlerinden iki yönden ayrılır\n>\n> **1. Farklı host.** `api.btcturk.com` değil, **`graph-api.btcturk.com`**.\n> Ortak taban adres bu uçta kullanılamaz.\n>\n> **2. Standart zarf yok.** `success` / `message` / `code` / `data` alanları bulunmaz.\n> Zarfı açan ortak yol (`SendAsync<T>`) bu uçta çalışmaz; ham yanıt okunmalıdır.\n\n### Parametreler\n\n| Parametre | Tip | Açıklama |\n|---|---|---|\n| `symbol` | string | `BTCTRY` |\n| `resolution` | int | 1, 15, 30, 60, 240 (dakika); ayrıca gün / hafta / yıl |\n| `from` | int | **Unix saniye** |\n| `to` | int | **Unix saniye** |\n\n### Canlı yanıt (25 Ağu 2026 doğrulaması)\n\n```json\n{\n  \"s\": \"ok\",\n  \"t\": [1787684400, 1787688000],\n  \"h\": [3809
