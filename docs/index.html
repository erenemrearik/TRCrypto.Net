//www.nuget.org/packages/BtcTurk.Net - Deprecated/unlisted package, legacy dependency ve isim sahipliği.\nR17 - NuGet Paribu.Api: https://www.nuget.org/packages/Paribu.Api - Mevcut third-party package/isim sahipliği ve ekosistem referansı.\nR18 - JKorf/cryptoexchange-skills-hub: https://github.com/JKorf/cryptoexchange-skills-hub - AI coding assistant ecosystem yaklaşımı.\n## Ek A - Örnek Consumer API\n| // Exchange-specific package using TRCrypto.BtcTurk.Clients; var btcTurk = new BtcTurkRestClient(); var ticker = await btcTurk.SpotApi.ExchangeData.GetTickerAsync(\"BTCTRY\"); // Shared abstraction using CryptoExchange.Net.SharedApis; ISpotTickerRestClient shared = btcTurk.SpotApi.SharedClient; var sharedTicker = await shared.GetSpotTickerAsync( new GetTickerRequest(new SharedSymbol(TradingMode.Spot, \"BTC\", \"TRY\"))); |\n\n\n## Ek B - Proje Başlangıç Checklist\n☐ NuGet organization ve `TRCrypto.*` package ID’leri rezerve edildi.\n☐ Repository branch protection aktif.\n☐ CryptoExchange.Net 12.5.0 pinned.\n☐ FND-001/FND-002 tamamlandı.\n☐ Binance TR vendor capability snapshot kaydedildi.\n☐ Public server time + symbols vertical slice merge edildi.\n☐ Authentication fixed-vector test geçiyor.\n☐ İlk order integration testi için dedicated test credential hazır.\n☐ Secret scanning CI üzerinde aktif.\n☐ Release dry-run package consumer sample ile restore/build edildi.\n| Geliştiriciye Son NotBu projede “önce bütün abstraction’ları tasarla, sonra endpoint yaz” yaklaşımı kullanılmamalıdır. Binance TR server-time + symbols ile küçük bir vertical slice oluştur; CryptoExchange.Net 12.5.0 convention’larını çalışan kod üzerinde sabitle; daha sonra public market data -> auth/trading -> WebSocket -> SharedApis sırasıyla ilerle. Her yeni exchange aynı checklist üzerinden eklenmelidir. |\n\n\n---\n---\n\n# EK: Doğrulama Notları (24 Ağustos 2026)\n\n> Bu bölüm orijinal spesifikasyonun parçası **değildir**. Geliştirme başlarken doküman\n> Bölüm 3.5'in emrettiği gibi (\"eski sürüm signature'ını ezbere kopyalamak yerine güncel\n> base-library contract'ına uy\") dokümandaki iddialar canlı kaynaklardan teyit edilmiştir.\n> Bir iddia ile bu ek arasında çelişki varsa **bu ek geçerlidir**.\n\n## E.1 Teyit Edilen İddialar\n\n| Doküman iddiası | Durum | Kanıt |\n|---|---|---|\n| `CryptoExchange.Net` 12.5.0 güncel sürüm | ✅ Doğru | NuGet: Jkorf, 5.826.187 indirme, en son sürüm |\n| `Binance.Net` 13.5.0 | ✅ Doğru | NuGet |\n| BtcTurk base URL `https://api.btcturk.com` | ✅ Doğru | `docs.btcturk.com/docs/general-information` |\n| BtcTurk auth: `X-PCK` / `X-Stamp` / `X-Signature`, HMAC-SHA256, Base64 secret | ✅ Doğru | `docs.btcturk.com/docs/authentication/authentication-v1` |\n| BtcTurk sembol formatı `BTCTRY` | ✅ Doğru (istek tarafı) | Resmi örnek: `?pairSymbol=BTCUSDT` |\n| Bitexen imza şeması `HMAC(apiKey+userName+passPhrase+timestamp+body)` | ✅ Doğru | Bağımsız üretim implementasyonuyla karşılaştırıldı |\n| Binance TR faaliyette | ✅ Doğru | binance.tr; lisanslı, 200+ TRY paritesi |\n\n## E.2 Düzeltmeler\n\n### D-1: Bölüm 10.5 eksik: hata ayrıştırma mimarisi\n\nDoküman \"Exchange'in response envelope'ı native modelde doğru parse edilir\" diyor ama\n**nasıl** olduğunu söylemiyor. CryptoExchange.Net 12.5.0'da hata ayrıştırma\n`MessageHandler.ParseErrorResponse()` üzerinden yapılır. `BtcTurkErrors` ve\nenvelope→error dönüşümü bu mekanizmaya bağlanmalıdır.\n\n### D-2: Bölüm 18.3'teki `RequestDefinition` örneği şekilseldir\n\n12.5.0'ın gerçek imzası:\n\n```csharp\nprotected virtual Task<HttpResult<T>> SendAsync<T>(\n    RequestDefinition definition,\n    Parameters? parameters,\n    CancellationToken cancellationToken,\n    Dictionary<string, string>? additionalHeaders = null,\n    int? weight = null,\n    int? weightSingleLimiter = null,\n    string? rateLimitKeySuffix = null)\n```\n\nAyrıca uri/body parametrelerini ayıran ikinci bir overload vardır. Base sınıf\n`RestApiClient<TEnvironment, TAuthenticationProvider, TApiCredentials>` generic'idir ve\n`protected abstract TAuthenticationProvider CreateAuthenticationProvider(TApiCredentials)`\nimplementasyonu ister.\n\n### D-3: Bölüm 7.2 eksik: BtcTurk sembol ayrıştırmaya gerek yok\n\nDoküman BtcTurk için \"Concatenate uppercase\" diyor; bu **istek** tarafı için doğrudur.\nAncak **yanıt** tarafında BtcTurk parite bileşenlerini zaten ayrı alanlar olarak döndürür:\n\n```json\n{ \"pair\": \"BTCTRY\", \"pairNormalized\": \"BTC_TRY\",\n  \"numerator\": \"BTC\", \"denominator\": \"TRY\" }\n```\n\n**Sonuç:** `SharedSymbol` eşlemesi `numerator`/`denominator` alanlarından yapılmalıdır.\nSembol string'ini ayrıştıran bir heuristik **yazılmayacaktır**. Bu, RISK-05'in\n(TL/TRY alias karmaşası) BtcTurk özelindeki etkisini ortadan kaldırır.\n\n### D-4: Bölüm 7.4'e ek: iki farklı zaman damgası birimi\n\nBtcTurk'te **OHLC hariç tüm** zaman damgaları milisaniye, **OHLC saniye** cinsindendir.\nTek bir `DateTimeConverter` varsayımı hatalıdır; iki ayrı converter gerekir ve her biri\nkendi fixture'ıyla test edilmelidir.\n\n### D-5: Bölüm 7.3'e ek: varlık sınıflandırması zorunlu\n\n`ISpotSymbolRestClient`, `SharedSymbolCatalog` üzerinden varlıkları `SharedAssetType`\n(`Unspecified` / `Crypto` / `Fiat` / `TradFi`) ve nullable `SharedAssetSubType`\n(`StableCoin` / `Equity` / `Commodity`) ile sınıflandırır. Türkiye borsaları için:\n\n- **TRY → `SharedAssetType.Fiat`**, alt tip yok\n- USDT/USDC → `Crypto` + `StableCoin`\n- BTC/ETH vb. → `Crypto`, alt tip yok\n\nGeçerli kombinasyonlar: `Crypto`+`StableCoin`, `TradFi`+`Equity`, `TradFi`+`Commodity`,\n`Fiat`+(alt tip yok). Sınıflandırılmamış varlık kripto **varsayılmaz**.\n\n### D-6: Bölüm 17.2 önceliği yükseltildi: P1 → P0\n\nDoküman JKorf'un AI assistant dosyalarını \"P1 developer-experience hedefi\" olarak\nişaretlemiş. Ancak `JKorf/cryptoexchange-skills-hub` artık canlıdır ve 33 kurulabilir\nskill içerir. `cryptoexchange-net` skill'i **geliştirmenin ilk gününde** kurulmuştur\n(`.claude/skills/cryptoexchange-net`) çünkü 12.5.0 kalıplarını ezberden yazma riskini\nazaltır. Bu, dokümanın kendi uyarısıyla (Bölüm 3.5) tutarlıdır.\n\n## E.3 Bu Ekin Kapsamadığı\n\nBinance TR (`/open/v1`), Paribu ve Bitexen'in endpoint envanterleri **henüz\ndoğrulanmamıştır**. Her biri kendi adapter'ı açılırken ADR-010 uyarınca resmi\ndokümantasyondan doğrulanacak ve `docs/vendor/<borsa>-capabilities.md` altında\ndondurulacaktır.\n\n---\n\n## E.4 İkinci Tur Bulguları (PR-002)\n\nPiyasa verisi uçları eklenirken ortaya çıkan, **yalnızca canlı API ile tespit edilebilen**\nve resmi dokümantasyonda yer almayan davranışlar:\n\n### D-7: `code` alanının tipi uçlar arasında tutarsız\n\n| Uç | `code` |\n|---|---|\n| exchangeinfo / ticker / trades | `0` (sayı) |\n| **orderbook** | `\"SUCCESS\"` (metin) |\n\nZarf modelinde bu alanı `int` olarak tanımlamak, emir defteri çağrılarını deserialization\nhatasıyla **tamamen kırar**. Alan metin olarak taşınır; sayısal değerler dönüştürülür.\n\nBu, doküman Bölüm 15.3'ün (\"sanitized real response fixture olarak saklanır\") neden\ngerekli olduğunun somut kanıtıdır. Resmi örnek yanıtlarla çalışılsaydı hata üretime kadar\nfark edilmezdi.\n\n### D-8: Başarılı yanıtlarda `message` boş string\n\nDokümantasyon `null` gösterir; canlı API `\"\"` döndürür. Null kontrolü yerine\n`string.IsNullOrEmpty` kullanılmalıdır.\n\n### D-9: Alan adları uçlar arasında tutarsız\n\nAynı kavram farklı uçlarda farklı adlandırılır:\n\n| Kavram | ticker | trades |\n|---|---|---|\n| Base varlık | `numeratorSymbol` | `numerator` |\n| Quote varlık | `denominatorSymbol` | `denominator` |\n\nAyrıca sayısal alanlar ticker'da **sayı**, trades'te **metin** olarak gelir.\n\n### D-10: Ticker ucu tek parite için de dizi döner\n\n`?pairSymbol=` verildiğinde bile yanıt bir dizidir. Boş dizi, bilinmeyen sembol anlamına\ngelir ve `ErrorType.UnknownSymbol` olarak yüzeye çıkarılır.\n\n### D-11: Trades yanıtında dokümante edilmemiş `side` alanı\n\nCanlı yanıt `\"side\": \"buy\"` / `\"sell\"` içerir; resmi örnekte yoktur. Shared katmanında\n`SharedOrderSide` eşlemesi için kullanılır.\n\n### D-12: Emir defteri kademeleri `ISymbolOrderBookEntry` gerektirir\n\n`SharedOrderBook` yapıcısı `ISymbolOrderBookEntry[]` ister. Bu arayüz **değiştirilebilir**\n(`set`) özellikler tanımlar; modelimiz değiştirilemez olduğundan arayüz açıkça uygulanır ve\n`set` erişimcileri `NotSupportedException` fırlatır.\n\n---\n\n## E.5 Üçüncü Tur Bulguları (M2: kimlik doğrulama)\n\n### D-13: Bakiye ucu ondalık ayırıcı olarak virgül kullanır\n\nResmi dokümantasyondaki bakiye örneği:\n\n```json\n\"balance\": \"27223,7283250757643288\",\n\"free\":    \"22349,3654565035348765\"\n```\n\nOysa piyasa verisi ve emir uçları nokta kullanır (`\"0.00269390\"`, `\"20000.00\"`) ve\nemir dokümantasyonu ondalık ayırıcı olarak noktayı açıkça şart koşar.\n\n**Etki:** Bakiyeyi `InvariantCulture` ile ayrıştırmak virgülü binlik ayırıcı sayar ve\ntutarı kat kat büyük gösterir. Bir bakiye görüntüleme kütüphanesinde bu sessiz ve\ntehlikeli bir hatadır, çünkü istisna fırlatmaz ve sadece yanlış sayı üretir.\n\n**Çözüm:** `BtcTurkDecimalConverter` her iki ayırıcıyı da kabul eder. Belirsizlik yoktur:\nBtcTurk binlik ayırıcı kullanmadığından (büyük sayılar `\"3708000\"` biçimindedir) bir\nvirgül her zaman ondalık ayırıcıdır. Doküman Bölüm 7.4'ün \"decimal precision kaybı testi\"\ngereksinimi bu senaryoyu da kapsayacak biçimde uygulanmıştır.\n\n### D-14: Kimlik doğrulama için resmi test vektörü yok\n\nDoküman Bölüm 15.2, imzalamanın \"resmi sample/test vector ile birebir\" doğrulanmasını\nşart koşar. BtcTurk böyle bir vektör yayınlamaz; `authentication/usage` sayfası da kod\nörneği içermez.\n\n**Çözüm:** Dokümante edilen algoritmanın bağımsız bir uygulamasıyla deterministik vektörler\nüretilip birim testlerine sabitlendi. Testlerden biri, Base64 decode adımı atlandığında\noluşacak *yanlış* imzayı da içerir; böylece zincirin bu adımının gerçekten uygulandığı\nkanıtlanır. Vektörler `docs/vendor/btcturk-capabilities.md` dosyasına da kaydedildi.\n\n### D-15: `RestRequestValidator` özel converter'lı alanları doğrulayamıyor\n\nCryptoExchange.Net'in contract test yardımcısı, ham JSON metnini model değeriyle birebir\nkarşılaştırır. Virgül ayırıcılı bakiye alanları bu karşılaştırmada başarısız olur\n(`\"27223,72...\"` vs `27223.72...`).\n\n**Çözüm:** Bakiye ucunun contract testi `skipResponseValidation: true` ile çalıştırılır;\nbu sayede istek üretimi ve imzalama doğrulanır. Yanıt eşlemesi ayrı ve daha ayrıntılı bir test\nsınıfında (`BalanceTests`) kapsanır.\n\n### D-16: Emir iptali eşzamansızdır\n\n`DELETE /api/v1/order` HTTP 200 döndürdüğünde istek yalnızca **alınmıştır**. Resmi\ndokümantasyon iptalin kesinleşmesinin WebSocket kanalı 452 üzerinden duyurulduğunu belirtir.\n\nBaşarılı yanıtı \"emir iptal edildi\" olarak yorumlamak, bir işlem botunda aynı pozisyona\nikinci kez emir girilmesine yol açabilir. `CancelOrderAsync` dokümantasyonu bu davranışı\naçıkça uyarı olarak taşır; kesinleşme için durum ayrıca sorgulanmalıdır.\n\nAyrıca bu uçta `code` alanı boş metin döner. Bu, D-7'deki tip tutarsızlığının ikinci örneği.\n\n### D-17: Emir alan adları uçlar arasında farklı\n\n| Kavram | open orders | all orders | single order | submit order |\n|---|---|---|---|---|\n| Sembol | `pairsymbol` | `pairsymbol` | `pairSymbol` | `pairSymbol` |\n| Oluşturulma | `time` | `time` | `time` | **`datetime`** |\n| İstemci kimliği | `orderClientId` | `orderClientId` | `orderClientId` | **`newOrderClientId`** |\n\nBüyük/küçük harf farkları ayrıştırmayı etkilemez (eşleme duyarsızdır), ancak\n`time`/`datetime` ve `orderClientId`/`newOrderClientId` gerçek isim farklarıdır ve emir\noluşturma yanıtı için ayrı bir model gerektirir (`BtcTurkOrderPlacement`).\n\n### D-18: Emir yöntemi yazımı uçlar arasında farklı\n\n`exchangeinfo` ucu `STOP_MARKET` / `STOP_LIMIT` (alt çizgili, büyük harf) döndürürken emir\nuçları `stopmarket` / `stoplimit` (alt çizgisiz, küçük harf) döndürür. Enum eşlemesi\nbüyük/küçük harfe duyarsızdır ama alt çizgi farkını çözemez; bu nedenle her iki biçim de\n`[Map]` içinde tanımlanmıştır. Tek biçim eşleştirilseydi stop emirleri tanınmazdı.\n\n---\n\n## E.6 Dördüncü Tur Bulguları (kline + kullanıcı işlem geçmişi)\n\n### D-19: Kline ucu ayrı host ve ayrı format kullanır\n\n`GET https://graph-api.btcturk.com/v1/klines/history` kullanılır, `api.btcturk.com` değil.\n\nBu uç, projedeki ortak kalıbın **iki** varsayımını birden kırar:\n\n1. **Tek taban adres yeterli değil.** Ortama ayrı bir `GraphBaseAddress` eklendi.\n2. **Standart zarf yok.** `success`/`message`/`code`/`data` alanları bulunmaz; zarfı açan\n   `SendAsync<T>` bu uçta çalışmaz. Ham yanıt için ayrı bir `SendRawAsync<T>` yolu eklendi.\n\nAyrıca veriler **paralel diziler** halinde gelir (`t`, `o`, `h`, `l`, `c`, `v`) ve zaman\ndamgaları **saniye** cinsindendir; diğer tüm uçlar milisaniye kullanır.\n\nDizi uzunlukları birbirini tutmadığında hangi değerin hangi muma ait olduğu belirsizdir;\neksik veriyi tahmin etmek yerine `InvalidOperationException` fırlatılır.\n\nCanlı yanıtta, resmi dokümantasyonda geçmeyen bir `s` (durum) alanı bulunur.\n\n### D-20: Kullanıcı işlem geçmişinde tutarlar işaretlidir\n\n`amount`, `fee` ve `tax` satış işlemlerinde **negatif** gelir; işaret varlığın hesaptan\nçıktığını belirtir. Mutlak değer bekleyen bir hesaplama (toplam hacim, komisyon toplamı)\nişareti yok sayarsa sonuç sessizce yanlış çıkar.\n\nNative modelde işaret korunur. Borsadan bağımsız modele geçerken mutlaka mutlak değere\nçevrilir, çünkü yön zaten `Side` alanında taşınır.\n\n### D-21: `tax` alanının shared karşılığı yok\n\nBtcTurk her işlem için ayrı bir vergi/kesinti tutarı bildirir. Bu alan Türkiye'ye özgüdür;\n`SharedUserTrade` modelinde yalnızca `Fee` bulunur ve vergi orada temsil edilemez.\n\nKomisyona eklemek toplamı bozar, atmak bilgi kaybettirir. Seçilen yol: native modelde\nkorunur, shared yüzeyde yalnızca komisyon aktarılır ve bu sınır belgelenir. Vergi hesabı\nyapan tüketiciler native API kullanmalıdır.\n\n### D-22: `orderId` filtresi diğer filtrelerle birleştirilemez\n\nİşlem geçmişi ucunda `orderId`, diğer parametrelerle birlikte kullanılamaz. Sessizce yok\nsaymak yanlış sonuç döndürürdü; birlikte verildiklerinde `ArgumentException` fırlatılır.\n\n---\n\n## E.7 Beşinci Tur Bulguları (WebSocket)\n\n### D-23: Socket mesajları dizi zarfı kullanır\n\nMesajlar `[tip, gövde]` biçiminde iki elemanlı bir dizidir; tip numarası gövdenin içinde\nde tekrar edilir. REST tarafındaki hiçbir kalıp buna benzemez.\n\nYönlendirme dizinin **ilk elemanına** göre yapılır. Bu, alan referansının derinliğinin\ndoğru verilmesini gerektirir: kök dizinin kendisi 0. seviyededir, **elemanları 1. seviyede\nokunur**. Derinlik 0 verildiğinde hiçbir alan eşleşmez, her mesaj \"değerlendirilemedi\"\ndiye düşer ve abonelik onayı beklenirken zaman aşımına uğrar. Belirti ile neden\narasındaki mesafe büyük olduğu için bu davranış bir regresyon testiyle sabitlenmiştir.\n\n### D-24: Dokümante edilmemiş mesaj kodları\n\n| Kod | Durum |\n|---|---|\n| `991` | Bağlantı kurulur kurulmaz, istenmeden gönderilen sürüm mesajı. Resmi model listesinde yoktur. |\n| `421` | Trade kanalına abone olunduğunda gelen kod. Resmi liste yalnızca `422 TradeSingle` içerir; gelen mesaj bir **liste** taşır. |\n\nBilinmeyen kodu ölümcül sayan bir istemci, daha ilk mesajda bağlantıyı düşürürdü.\n\n### D-25: Socket alan adları REST'ten tamamen farklı\n\nTicker alanları tek/iki harfe kısaltılmıştır (`B`, `A`, `PS`, `LA`, `DP`…) ve değerler\n**metin** olarak gelir; REST ticker ucu aynı veriyi açık adlarla ve **sayı** olarak\ndöndürür. Aynı kavram için iki ayrı model gerekir.\n\n### D-26: İşlem yönü sayısal ve anlamı belgesiz\n\nSocket akışındaki `S` alanı sayısaldır; REST `\"buy\"` / `\"sell\"` metni kullanır. Sayının\nhangi yöne karşılık geldiği hiçbir yerde yazmaz.\n\nTahmin etmek yerine, canlı akıştaki işlem kimlikleri REST işlem ucundaki karşılıklarıyla\neşleştirildi: 15 eşleşen işlemde çelişkisiz olarak **`0` satış, `1` alış**. Eşleme bir\ntestle sabitlendi; borsa kodları değiştirirse test kırılır, kütüphane sessizce yanlış yön\nraporlamaz.\n\n### D-27: Emir defteri sıra numarası taşır\n\n`CS` alanı, fark mesajlarında atlama olup olmadığını anlamayı sağlar. Bu bilgi olmadan\ndefter sessizce bozulabilir; alan native modelde korunur ve tüketiciye sunulur.\n\n### D-28: Socket giriş imzası REST'ten farklı görünüyor\n\nResmi dokümantasyon socket giriş imzasının `publicKey + nonce` üzerinden hesaplandığını\nbelirtir; REST ise `apiKey + stamp` kullanır. Bu fark canlı bir hesapla doğrulanmadığı\niçin kullanıcıya özel akışlar **uygulanmamıştır**, çünkü yanlış imza sessizce başarısız olur ve\nhata mesajı nedeni göstermez.\n\n---\n\n## E.8 Canlı Hesap Doğrulaması (26 Ağustos 2026)\n\nGerçek bir BtcTurk hesabına karşı yapılan ilk doğrulama turu. Yalnızca okuma işlemleri\nyapıldı; emir oluşturulmadı.\n\n### D-13 DÜZELTİLDİ: bakiye ucu nokta kullanıyor, virgül değil\n\nDoküman E.4'te (D-13) resmi dokümantasyonun bakiye örneğine dayanarak \"bu uç virgül\nkullanır\" denmişti. **Canlı yanıt bunu yalanladı:** ondalıklı alanların tamamı nokta\nayırıcılıydı, virgüllü tek alan yoktu.\n\n`BtcTurkDecimalConverter` yine de her iki biçimi kabul etmeye devam ediyor. Kaldırmamanın\ngerekçesi: resmi dokümantasyon virgül vaat ediyor, dolayısıyla bazı hesap ya da ortam\nkoşullarında virgül dönme ihtimali var ve yanlış yorumlanan bir bakiye kat kat büyük\ngörünür. Savunmacı davranmanın maliyeti yok.\n\n**Asıl ders:** bu, dokümantasyona güvenip canlı doğrulamayı atlamanın ters yönde de\ntehlikeli olduğunu gösteriyor. D-7'de resmi örnek eksikti; burada resmi örnek fazladan\nbir şey vaat ediyordu.\n\n### D-29: REST imzalama gerçek hesapta doğrulandı\n\n`Base64Decode(secret)` → `HMAC-SHA256(apiKey + stamp)` → `Base64` zinciri kabul edildi.\nBakiye ucu başarıyla çağrıldı, yanıt ayrıştırıldı ve her varlık için\n`toplam = serbest + kilitli` eşitliği doğrulandı. Bu eşitlik aynı zamanda ondalık\nçözümünün canlı kanıtıdır.\n\n### D-30: Socket giriş imzası REST'ten GERÇEKTEN farklı\n\nE.7'de (D-28) bu fark \"doğrulanmadı\" olarak işaretlenmişti. Canlı denemeyle kesinleşti:\n\n| | İmzalanan değer |\n|---|---|\n| REST istekleri | `apiKey + stamp` (stamp = UTC milisaniye) |\n| **Socket girişi** | **`publicKey + nonce`** |\n\nDört aday biçim sırayla denendi; yalnızca `publicKey + nonce` kabul edildi. `nonce`\nzaman damgasından bağımsız bir sayıdır (denemede sabit `3000` kabul edildi).\n\nYanlış imza yalnızca `Unauthorized - Invalid Signature` döndürür ve hangi varsayımın\nhatalı olduğunu belirtmez; bu yüzden adayları tek tek denemek tek güvenilir yoldu.\n\n### D-31: Özel akış mesajları hesap hareketi olmadan gelmiyor\n\nGiriş yaptıktan sonra 45 saniye dinlendi. Yalnızca giriş onayı (`114`) ve sürüm mesajı\n(`991`) geldi. `423` (UserTrade), `441` (OrderMatch), `451`/`452`/`453` (Order*)\nkodlarının hiçbiri görülmedi.\n\nBu beklenen davranıştır: bu mesajlar emir girildiğinde, eşleştiğinde ya da iptal\nedildiğinde üretilir. **Gövdeleri hâlâ bilinmiyor** ve dokümantasyonda da yok.\n\nSonuç: özel akış modelleri yazılabilmesi için hesapta gerçek bir emir hareketi gerekiyor.\nEmir girme ve iptal (`451`, `452`) piyasadan uzak bir limit emriyle eşleşme olmadan\ngözlenebilir; işlem bildirimleri (`423`, `441`) ise gerçek bir eşleşme gerektirir.\n\n---\n\n## E.9 Binance TR Bulguları\n\n### D-32: Yanıt zarfı BtcTurk'ten tamamen farklı\n\n| | BtcTurk | Binance TR |\n|---|---|---|\n| Başarı | `success` (bool) | **yok**; `code == 0` |\n| Mesaj | `message` | `msg` |\n| Zaman | yok | `timestamp` (zarf seviyesinde) |\n\nİki borsa için tek bir zarf modeli kullanılamaz. Her adaptörün kendi zarfı ve kendi hata\nçevirisi vardır. Bu, spesifikasyonun \"her borsa bağımsız adapter\" kararını (ADR-003)\ndoğruluyor.\n\nSunucu saati ucu gövdesinde veri taşımaz; istenen değer yalnızca zarftadır. Bu yüzden\nzarfı açmayan ayrı bir gönderim yolu gerekti.\n\n### D-33: Global Binance'te public olan uçlar burada anahtar istiyor\n\n`/api/v3/*` yolları, yani global Binance'te herkese açık olan piyasa verisi uçları, Binance TR'de\n`3701 Invalid API-key, IP, or permissions` döndürüyor. Global Binance için yazılmış kod\nburada çalışmaz; ADR-005'in öngördüğü durum tam olarak budur.\n\n**Sonuç:** REST üzerinden anahtarsız ticker verisi alınamıyor. BtcTurk'te bedava olan bir\nyetenek burada anahtar gerektiriyor ve `Discover()` bu farkı bildiriyor.\n\n### D-34: Başarılı görünüp boş dönen uçlar\n\n`market/trades` ve `market/klines` `code: 0` ile yanıt verip boş liste döndürüyor\n(denenen tüm paritelerde, tarih filtresiyle veya filtresiz).\n\nHata dönen bir uçtan daha tehlikelidir: çağıran taraf bunu \"işlem yok\" olarak okur.\nİşlem verisi için `agg-trades` kullanılır; her iki veri de WebSocket üzerinden sorunsuz\nakıyor (D-36).\n\n### D-35: Emir defteri kademe sayısı sabit değerlerle sınırlı\n\nYalnızca `5, 10, 20, 50, 100, 500, 1000` kabul ediliyor. Diğer değerler\n`1106 Incorrect Page number` ile reddediliyor ve mesaj sorunun limit olduğunu **söylemiyor**.\nİstemci bunu ağa çıkmadan reddeder.\n\n### D-36: WebSocket, REST'in veremediğini veriyor\n\n| Veri | REST | WebSocket |\n|---|---|---|\n| Ticker | ❌ anahtar gerekiyor | ✅ anahtarsız |\n| Tekil işlemler | ⚠️ boş liste | ✅ çalışıyor |\n| Mum verisi | ⚠️ boş liste | ✅ çalışıyor |\n\nBu nedenle Binance TR'de ticker desteği yalnızca socket yüzeyinde sunuluyor.\n\n### D-37: Sembol formatı aynı borsa içinde üç farklı biçimde\n\n| Yer | Biçim |\n|---|---|\n| REST istek ve yanıt | `BTC_TRY` |\n| WebSocket abonelik | `btctry` |\n| WebSocket yanıt | `BTCTRY` |\n\nAbonelikte yanlış biçim **hata üretmez**: bağlantı kurulur, hiçbir mesaj gelmez. Sorun\nancak \"veri akmıyor\" olarak fark edilir, bu yüzden dönüşüm testle sabitlenmiştir.\n\n### D-38: Alan eşleşmesi büyük/küçük harfe duyarlı olmalı\n\nWebSocket akışları tek harfli alanlar kullanır ve harf büyüklüğü anlam taşır: `p` fiyat\ndeğişimi / `P` yüzde değişim, `b` alış fiyatı / `B` alış miktarı, `U` ilk sıra / `u` son sıra.\n\nDuyarsız eşleşme bu çiftleri çakıştırır ve ayrıştırma tamamen başarısız olur.\n\n**BtcTurk tam tersini gerektiriyordu:** orada aynı alan uçlar arasında farklı harf\nbüyüklüğüyle geldiği için duyarsız eşleşme şarttı (D-17). İki borsa için tek bir\nserileştirme ayarı kullanılamaz.\n\n### D-39: Yönlendirme kimliği bağlantıya değil mesaja bağlı olmalı\n\nBinance TR'de akış, bağlantı adresinin parçasıdır (`/ws/<akış>`). İlk uygulamada\nyönlendirme kimliği istemci üzerinde bir alanda tutuldu; her yeni abonelik öncekinin\nkimliğini ezdi ve **yalnızca en son abonelik mesaj aldı**. Diğerleri hata vermeden sessizce\nboş kaldı.\n\nKimlik artık mesajın kendisinden türetiliyor: olay türü `e` alanından, taşımayan akışlar\niçin sabit bir görüntü kimliğinden. Regresyon testi bu davranışı sabitler.\n\n---\n\n## E.10 Yüzeyler Tamamlanırken Çıkan Bulgular\n\n### D-40. BtcTurk tüm ticker akışında olay adı \"all\" olmalıdır\n\nKanal 401, borsadaki bütün pariteleri tek abonelikle gönderir. Abonelik isteğinde\n`event` alanı **`\"all\"`** olmalıdır.\n\nBoş bir olay adıyla ya da alan hiç gönderilmeden abone olunduğunda borsa\n`{\"ok\": true, \"message\": \"join|ticker:\"}` yanıtını veriyor, yani **isteği onaylıyor**,\nama tek bir güncelleme bile göndermiyor. Üç aday ayrı bağlantılarda denendi:\n\n| Abonelik isteği | Onay | Gelen 401 mesajı |\n|---|---|---|\n| `event: \"\"` | ✅ ok | 0 |\n| `event` alanı yok | ✅ ok | 0 |\n| `event: \"all\"` | ✅ ok | 12 |\n\nHata dönmediği için sorun ancak \"veri akmıyor\" olarak fark edilir. Değer testle\nsabitlenmiştir.\n\nGövde `{items: [...], channel, event, type}` biçimindedir ve her mesaj 379 paritenin\ntamamını taşır. Öğelerin alan şeması tek parite akışıyla (kod 402) aynıdır, bu yüzden\nayrı bir model gerekmez.\n\n### D-41. Yönlendirme eşlemesi gövde tipine göre kayıtlıdır\n\nKütüphane, gelen mesajın hangi aboneliğe ait olduğunu gövde tipine bağlı bir eşlemeden\nokur. Yeni bir gövde tipi için eşleme kaydedilmezse konu adı `null` döner ve mesaj hiçbir\naboneliğe ulaşmaz.\n\nBu, D-40'ın uygulanması sırasında yaşandı: abonelik başarıyla kuruldu, sunucu saniyede bir\nmesaj gönderdi, ama hiçbiri kullanıcının işlevine ulaşmadı. İz kaydı nedeni açıkça\ngösterdi:\n\n```\nreceived message not matched to any listener.\nTypeIdentifier: 401, TopicFilter: (null), registered TopicFilters for type: [all]\n```\n\nListe akışında parite adı bulunmadığı için konu adı, mesajın kendi `event` alanından\nokunur. Kimliğin istemcide tutulan bir alandan değil mesajın içeriğinden türetilmesi\nkuralı, Binance TR tarafında da aynı sınıftan bir hataya yol açmıştı (D-39).\n\n### D-42. Binance TR private uçları sayısal enum kullanır\n\nEmir yönü, türü, durumu ve geçerlilik süresi metin değil **sayı** olarak taşınır.\n\n| Alan | Değerler |\n|---|---|\n| `side` | 0 alış · 1 satış |\n| `type` | 1 limit · 2 piyasa · 3 stop loss · 4 stop loss limit · 5 take profit · 6 take profit limit · 7 limit maker |\n| `status` | -2 sistem işliyor · 0 yeni · 1 kısmen doldu · 2 doldu · 3 iptal · 4 iptal bekliyor · 5 reddedildi · 6 süresi doldu |\n| `timeInForce` | 1 GTC · 2 IOC · 3 FOK · 4 GTX |\n\nGlobal Binance aynı bilgileri metin olarak döndürür. Oradan taşınan kod burada sessizce\nyanlış çözümlenir: örneğin `status: 2` metin bekleyen bir eşlemede tanınmaz ve emir\n\"bilinmeyen durum\" olarak okunur.\n\nHesap izinleri (`canTrade`, `canWithdraw`, `canDeposit`) ve işlem bayrakları\n(`isBuyer`, `isMaker`, `isWorking`) da mantıksal değer yerine 0 ya da 1 gönderilir.\n\n### D-43. Emir oluşturma yanıtı hata mesajını farklı bir alanda döndürür\n\n`POST /open/v1/orders` hata metnini `message` alanında, diğer bütün private uçlar `msg`\nalanında döndürür. Tek bir alan adı beklemek, emir hatalarının mesajsız görünmesine yol\naçar; bu da en çok bilgi gereken anda en az bilgi verildiği anlamına gelir. Zarf her iki\nadı da okur.\n\n### D-44. Zaman damgaları uçlar arasında sayı ya da metin olabilir\n\nEmir kayıtlarında `createTime` sayı olarak, işlem kayıtlarında `time` metin olarak gelir.\nİkisi de milisaniyedir. Varsayılan çözümleyici her iki durumda da hata verir; kütüphanenin\nzaman dönüştürücüsü iki biçimi de okur."},"katki":{"title":"Katkı rehberi","heading":"Katkı Rehberi","source":"CONTRIBUTING.md","body":"TRCrypto.Net'e katkıda bulunmak istediğiniz için teşekkürler. Bu proje Türkiye'deki\nkripto borsalarını .NET geliştiricileri için erişilebilir kılmayı amaçlıyor.\n\n## Başlamadan önce\n\n```bash\ngit clone https://github.com/erenemrearik/TRCrypto.Net.git\ncd TRCrypto.Net\n\n# Secret koruma kancasini etkinlestirin (bir kez)\ngit config core.hooksPath .githooks\n\ndotnet build -c Release\ndotnet test  -c Release\n```\n\nGerekli: **.NET 10 SDK** (paket `net8.0`'a kadar geriye dönük hedefler).\n\n### İki tür test var\n\n| Tür | Ne yapar | Nerede çalışır |\n|---|---|---|\n| **Birim** | Ağa çıkmaz; sabit yanıtlarla çözümleme, istek kurulumu ve doğrulama | Her PR'da |\n| **Canlı** (`*.IntegrationTests`) | Borsanın gerçek API'sine çıkar | Haftalık zamanlanmış iş |\n\nCanlı testler PR akışında çalıştırılmaz: her PR için borsanın istek limitini yakmamak ve\nderlemeyi borsanın erişilebilirliğine bağımlı kılmamak için. Amaçları regresyon yakalamak\ndeğil, **borsanın değiştiğini** fark etmektir.\n\nKimlik bilgisi isteyen canlı testler, anahtar tanımlı değilse **atlanır.** Anahtarı\nolmayan bir katkıcı da her şeyi çalıştırabilir.\n\n```bash\ndotnet test -c Release --filter \"FullyQualifiedName!~IntegrationTests\"   # yalnizca birim\ndotnet test -c Release --filter \"FullyQualifiedName~IntegrationTests\"    # yalnizca canli\n```\n\n### Doküman değiştirdiyseniz siteyi yeniden üretin\n\nDokümanlar `.md` dosyalarında yaşar; [dokümantasyon sitesi](https://erenemrearik.github.io/TRCrypto.Net/) onlardan üretilir\nve `docs/index.html` olarak depoda tutulur. Bir doküman değiştirip siteyi yeniden\nüretmezseniz ikisi ayrışır. CI bunu yakalar ve derlemeyi durdurur.\n\n```bash\nnode tools/site/build.mjs   # siteyi yeniden uret\nnode tools/site/check.mjs   # markdown isleyicisini dogrula\n```\n\nBağımlılık yoktur; yalnızca Node 18+ gerekir. Yeni bir doküman eklediyseniz\n`tools/site/build.mjs` içindeki gezinti listesine de ekleyin.\n\nProjenin şu anki durumu ve sonraki adımlar: [docs/DURUM.md](#/durum)\n\n---\n\n## 🔐 En önemli kural: secret'lar\n\n**Gerçek API anahtarı asla commit edilmez.** Bu finansal bir kütüphanedir; sızan bir\nanahtar gerçek para kaybettirebilir.\n\n- Kimlik bilgileri `dotnet user-secrets` ile saklanır. Ayrıntı:\n  [docs/credentials/README.md](#/anahtar-guvenlik)\n- `.gitignore` yaygın secret dosyalarını bloklar, ama tek savunma o değildir\n- Pre-commit kancası `gitleaks` ile hazırlanan değişiklikleri tarar\n- Testlerde gerçekçi görünümlü **sahte** değerler kullanılır ve `FAKE` ibaresi taşır\n\nYanlışlıkla bir anahtar commit ettiyseniz: **önce borsadan anahtarı silin**, sonra bize\nhaber verin. Geçmişi temizlemek ikincil önceliktir; anahtarı iptal etmek birincildir.\n\n---\n\n## Endpoint eklerken\n\nBu projenin en katı kuralı şudur:\n\n> ### Endpoint uydurulmaz.\n>\n> Bir uç yalnızca **resmi dokümantasyondan** doğrulandıysa yazılır. Üçüncü taraf\n> wrapper'lar (ccxt, arşivlenmiş kütüphaneler) yalnızca keşif içindir, kontrat kaynağı\n> değildir.\n\nSıra:\n\n1. **Vendor freeze.** Ucu `docs/vendor/<borsa>-capabilities.md` dosyasına kaydedin:\n   method, path, parametreler, örnek yanıt, kaynak link, erişim tarihi.\n   Doğrulayamıyorsanız \"dondurulmamış\" olarak işaretleyin ve **yazmayın**.\n\n2. **Fixture.** `tests/.../Fixtures/` altına gerçek bir yanıt koyun.\n   **Canlı public API'den alınmış yanıt tercih edilir**; resmi örnekler eksik olabiliyor.\n   (Bunun somut örnekleri için `docs/spec/` ekindeki D-7…D-12 bulgularına bakın.)\n\n3. **Test önce.** Testi yazın, **başarısız olduğunu görün**, sonra kodu yazın.\n\n4. **Contract testi.** `tests/.../Endpoints/` altına şu formatta bir dosya ekleyin:\n   ```\n   GET\n   /api/v2/...\n   false\n   {gercek yanit JSON}\n   ```\n   `RestRequestValidator` üretilen isteği ve model eşlemesini doğrular.\n\n### Modelleme kuralları\n\n| Kural | Neden |\n|---|---|\n| Fiyat/miktar için **`decimal`** | `double` hassasiyet kaybettirir |\n| Enum'larda **`Unknown` üyesi tanımlanmaz** | Ekosistem konvansiyonu: bilinmeyen değer tanımsız enum değerine düşer, `Enum.IsDefined` ile tespit edilir |\n| Sembol adı **ayrıştırılmaz** | Borsalar base/quote'u genelde ayrı alanda veriyor |\n| Varlık türü **tahmin edilmez** | Borsa bildiriyorsa o kullanılır |\n| Tüm async metotlarda `CancellationToken ct = default` | |\n| Kütüphane kodunda `ConfigureAwait(false)` | Analyzer zorluyor (CA2007) |\n| Tüm public üyelerde XML dokümantasyonu | |\n| Yorumlar **neden**i anlatır, **ne**yi değil | Kod zaten ne yaptığını söylüyor |\n\n### Geçersiz girdi\n\nAğa çıkmadan reddedilmelidir:\n\n```csharp\nif (limit is <= 0 or > MaxTradeLimit)\n    throw new ArgumentOutOfRangeException(nameof(limit), limit, \"...\");\n```\n\n---\n\n## Hata yönetimi\n\nAPI hataları **istisna olarak fırlatılmaz**, sonuç nesnesi olarak döner.\n\nBazı borsalar iş mantığı hatalarını HTTP 200 içinde döndürür (BtcTurk'te\n`\"success\": false`). Bu durum `MessageHandler` katmanında yakalanıp başarısız sonuca\nçevrilmelidir. Aksi halde çağıran taraf sessizce boş veri işler.\n\nBilinmeyen hata kodları **yutulmaz**; ham kod ve mesaj çağırana taşınır.\n\n---\n\n## Emir işlemleri (dikkat)\n\nEmir verme/iptal gerçek para hareketi yaratır.\n\n- Otomatik yeniden deneme **yapılmaz** (ADR-009), çünkü emir çift işlenebilir\n- Örneklerde piyasa emri değil, **limit emri** kullanılır\n- Çekim (withdrawal) desteği MVP kapsamı dışındadır ve rehberlerde önerilmez\n\n---\n\n## Pull request\n\nPR'ınızdan önce:\n\n```bash\ndotnet build -c Release   # 0 warning\ndotnet test  -c Release   # hepsi yesil\n```\n\n- Bir PR bir konuya odaklansın; ilgisiz düzeltmeleri ayırın\n- Commit mesajı **ne** değil **neden** anlatsın\n- Yeni uç eklediyseniz README'deki tabloyu güncelleyin\n- Vendor dosyasına erişim tarihini yazın\n\nYeni bir bors const ALERTS = {
  NOTE: ['note', 'Not'],
  TIP: ['tip', 'İpucu'],
  IMPORTANT: ['important', 'Önemli'],
  WARNING: ['warning', 'Uyarı'],
  CAUTION: ['caution', 'Dikkat'],
};

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function slug(text) {
  return text
    .toLowerCase()
    .replace(/[çÇ]/g, 'c').replace(/[ğĞ]/g, 'g').replace(/[ıİ]/g, 'i')
    .replace(/[öÖ]/g, 'o').replace(/[şŞ]/g, 's').replace(/[üÜ]/g, 'u')
    .replace(/[^\w\s-]/g, '')
    .trim()
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-') || 'bolum';
}

/** Satir ici bicimlendirme. Kod parcalari once ayrilir ki icleri islenmesin. */
function inline(src) {
  const stash = [];
  let s = src.replace(/`([^`]+)`/g, (_, code) => {
    stash.push('<code>' + esc(code) + '</code>');
    return '␀' + (stash.length - 1) + '␀';
  });

  s = esc(s);

  s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, (_, text, href) => {
    const external = /^https?:/.test(href);
    const attrs = external ? ' target="_blank" rel="noopener noreferrer"' : '';
    return '<a href="' + href + '"' + attrs + '>' + text + '</a>';
  });

  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');

  return s.replace(/␀(\d+)␀/g, (_, i) => stash[+i]);
}

/** Kod blogu vurgusu: yorum, metin, anahtar sozcuk, sayi ve tip adi. */
function highlight(code, lang) {
  const out = esc(code);
  if (lang === 'json') {
    return out
      .replace(/(&quot;(?:[^&\\]|\\.)*?&quot;)(\s*:)/g, '<span class="tok-t">$1</span>$2')
      .replace(/:\s*(&quot;(?:[^&\\]|\\.)*?&quot;)/g, ': <span class="tok-s">$1</span>')
      .replace(/\b(-?\d+\.?\d*(?:[eE][-+]?\d+)?)\b/g, '<span class="tok-n">$1</span>')
      .replace(/\b(true|false|null)\b/g, '<span class="tok-k">$1</span>');
  }
  if (lang === 'bash') {
    return out.replace(/(^|\n)(\s*#[^\n]*)/g, '$1<span class="tok-c">$2</span>');
  }
  if (lang === 'csharp') {
    const kw = 'var|new|await|async|public|private|internal|protected|sealed|static|class|record|struct|'
      + 'interface|enum|return|if|else|foreach|for|while|using|namespace|null|true|false|this|base|'
      + 'string|int|long|decimal|bool|double|void|Task|override|readonly|const|out|ref|in|is|as|switch|case|default';
    return out
      .replace(/(\/\/[^\n]*)/g, '<span class="tok-c">$1</span>')
      .replace(/(&quot;(?:[^&\\]|\\.)*?&quot;)/g, '<span class="tok-s">$1</span>')
      .replace(new RegExp('\\b(' + kw + ')\\b(?![^<]*<\\/span>)', 'g'), '<span class="tok-k">$1</span>')
      .replace(/\b(\d+[\d_]*\.?\d*[mMdDfFlL]?)\b(?![^<]*<\/span>)/g, '<span class="tok-n">$1</span>');
    }
  return out;
}

/** Yalnizca durum isareti tasiyan hucreleri rozete cevirir. */
function statusCell(html) {
  const bare = html.replace(/<[^>]+>/g, '').trim();
  const map = [
    [/^✅\s*(.*)$/u, 'ok'],
    [/^⏳\s*(.*)$/u, 'wait'],
    [/^⚠️?\s*(.*)$/u, 'warn'],
    [/^❌\s*(.*)$/u, 'no'],
  ];
  for (const [re, kind] of map) {
    const m = bare.match(re);
    if (!m) continue;
    const label = m[1].trim();
    return '<span class="pill ' + kind + '">' + (label ? esc(label) : kindLabel(kind)) + '</span>';
  }
  return html;
}

function kindLabel(kind) {
  return { ok: 'hazır', wait: 'sırada', warn: 'dikkat', no: 'yok' }[kind];
}

function splitRow(line) {
  return line.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map((c) => c.trim());
}

    // Spesifikasyon dosyasi .docx'ten cevrildigi icin ayirici satiri olmayan tablolar
    // da iceriyor. Bunlar isaretleme olarak eksiktir ama icerik olarak tablodur;
    // duz metin olarak birakilirlarsa sayfanin en yogun bolumleri okunmaz hale gelir.
    if (/^\s*\|/.test(line)) {
      const hasSeparator = i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1]);
      flushParagraph(para);

      const header = splitRow(line);
      i += hasSeparator ? 2 : 1;

      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) {
        if (/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i])) { i++; continue; }
        rows.push(splitRow(lines[i++]));
      }

      // Tek hucreli tek satir: .docx'teki kutu notu. Tablo olarak degil, kutu olarak.
      if (!hasSeparator && !rows.length && header.length === 1) {
        out.push('<div class="callout"><p>' + inline(header[0]) + '</p></div>');
        continue;
      }

      const columns = Math.max(header.length, ...rows.map((r) => r.length));

      let html = '<div class="table-wrap"><table><thead><tr>';
      for (let c = 0; c < columns; c++) html += '<th>' + inline(header[c] ?? '') + '</th>';
      html += '</tr></thead><tbody>';
      for (const row of rows) {
        html += '<tr>';
        for (let c = 0; c < columns; c++) html += '<td>' + statusCell(inline(row[c] ?? '')) + '</td>';
        html += '</tr>';
      }
      out.push(html + '</tbody></table></div>');
      continue;
    }

    // Alinti ve uyari kutusu
    if (/^\s*>/.test(line)) {
      flushParagraph(para);
      const body = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        body.push(lines[i].replace(/^\s*>\s?/, ''));
        i++;
      }
      const alert = body[0] && body[0].match(/^\[!(\w+)\]\s*$/);
      if (alert && ALERTS[alert[1].toUpperCase()]) {
        const [kind, label] = ALERTS[alert[1].toUpperCase()];
        const inner = render(body.slice(1).join('\n'));
        out.push(
          '<div class="callout ' + kind + '"><span class="callout-label">' + label + '</span>' + inner.html + '</div>'
        );
      } else {
        out.push('<blockquote>' + render(body.join('\n')).html + '</blockquote>');
      }
      continue;
    }

    // Liste
    const bullet = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
    if (bullet) {
      flushParagraph(para);
      const block = [];
      while (i < lines.length) {
        const cur = lines[i];
        if (/^\s*([-*+]|\d+[.)])\s+/.test(cur) || (cur.trim() && /^\s{2,}/.test(cur))) {
          block.push(cur);
          i++;
          continue;
        }
        if (!cur.trim() && i + 1 < lines.length && /^\s{2,}\S/.test(lines[i + 1])) {
          block.push(cur);
          i++;
          continue;
        }
        break;
      }
      out.push(renderList(block));
      continue;
    }

    if (!line.trim()) {
      flushParagraph(para);
      i++;
      continue;
    }

    para.push(line);
    i++;
  }

  flushParagraph(para);
  return { html: out.join('\n'), headings };
}

/** Ic ice listeleri girinti derinligine gore kurar. */
function renderList(block) {
  const items = [];
  for (const raw of block) {
    const m = raw.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
    if (m) {
      items.push({ indent: m[1].replace(/\t/g, '  ').length, ordered: /\d/.test(m[2]), lines: [m[3]] });
    } else if (items.length) {
      items[items.length - 1].lines.push(raw.trim());
    }
  }
  if (!items.length) return '';

  const build = (start, indent) => {
    const parts = [];
    let k = start;
    const ordered = items[start].ordered;
    while (k < items.length && items[k].indent >= indent) {
      if (items[k].indent > indent) {
        const [child, next] = build(k, items[k].indent);
        parts[parts.length - 1] = parts[parts.length - 1].replace(/<\/li>$/, child + '</li>');
        k = next;
        continue;
      }
      parts.push('<li>' + inline(items[k].lines.join(' ')) + '</li>');
      k++;
    }
    const tag = ordered ? 'ol' : 'ul';
    return ['<' + tag + '>' + parts.join('') + '</' + tag + '>', k];
  };

  return build(0, items[0].indent)[0];
}

/* ═══ Uygulama ═══════════════════════════════════════════════════════════════ */

const railEl = document.getElementById('rail');
const docEl = document.getElementById('doc');
const tocEl = document.getElementById('toc');
const searchEl = document.getElementById('search');
const scrimEl = document.getElementById('scrim');
const menuBtn = document.getElementById('menuBtn');
const themeBtn = document.getElementById('themeBtn');

const flat = NAV.flatMap((g) => g.pages.map((p) => ({ ...p, group: g.group })));

function buildRail() {
  let html = '';
  for (const group of NAV) {
    html += '<div class="rail-group"><h2>' + esc(group.group) + '</h2><ul>';
    for (const page of group.pages) {
      html += '<li><a href="#/' + page.id + '" data-id="' + page.id + '">' + esc(page.title) + '</a></li>';
    }
    html += '</ul></div>';
  }
  html +=
    '<div class="rail-foot">' +
    '<a href="' + REPO + '" target="_blank" rel="noopener noreferrer">GitHub deposu</a><br>' +
    'MIT lisansı<br>' +
    '<span title="Sitenin üretildiği doküman setinin parmak izi">doküman ' + esc(GENERATED) + '</span>' +
    '</div>';
  railEl.innerHTML = html;
}

function markCurrent(id) {
  for (const a of railEl.querySelectorAll('a[data-id]')) {
    if (a.dataset.id === id) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  }
}

function buildToc(headings) {
  if (headings.length < 2) {
    tocEl.innerHTML = '';
    return;
  }
  let html = '<h2>Bu sayfada</h2><ul>';
  for (const h of headings) {
    html += '<li><a href="#' + h.id + '" class="' + (h.level === 3 ? 'lvl3' : '') + '">' + esc(h.text) + '</a></li>';
  }
  tocEl.innerHTML = html + '</ul>';
}

function neighbours(id) {
  const index = flat.findIndex((p) => p.id === id);
  return { prev: flat[index - 1], next: flat[index + 1] };
}

function footer(id) {
  const { prev, next } = neighbours(id);
  if (!prev && !next) return '';
  return (
    '<div class="doc-foot">' +
    (prev ? '<a class="prev" href="#/' + prev.id + '">' + esc(prev.title) + '</a>' : '<span></span>') +
    (next ? '<a class="next" href="#/' + next.id + '">' + esc(next.title) + '</a>' : '<span></span>') +
    '</div>'
  );
}

function showPage(id, anchor) {
  const page = DOCS[id];
  if (!page) return showPage('giris');

  markCurrent(id);
  document.title = (id === 'giris' ? 'TRCrypto.Net Kılavuzu' : page.title + ' · TRCrypto.Net');

  if (id === 'giris') {
    docEl.innerHTML = homePage() + footer(id);
    buildToc([
      { id: 'tez', text: 'Aynı kod, iki borsa', level: 2 },
      { id: 'paketler', text: 'Paketler', level: 2 },
      { id: 'nereden', text: 'Nereden başlamalı', level: 2 },
      { id: 'kurulum', text: 'Kurulum', level: 2 },
    ]);
  } else {
    const { html, headings } = render(page.body);
    const group = flat.find((p) => p.id === id).group;
    const source = page.source
      ? '<div class="doc-source">kaynak · <a href="' + REPO + '/blob/main/' + page.source +
        '" target="_blank" rel="noopener noreferrer">' + esc(page.source) + '</a></div>'
      : '';
    docEl.innerHTML =
      '<div class="doc-head"><div class="doc-eyebrow">' + esc(group) + '</div><h1>' +
      esc(page.heading) + '</h1>' + source + '</div>' + html + footer(id);
    buildToc(headings);
  }

  wireCopy();
  observeHeadings();

  if (anchor) {
    const target = document.getElementById(anchor);
    if (target) {
      target.scrollIntoView({ behavior: 'auto', block: 'start' });
      return;
    }
  }
  window.scrollTo(0, 0);
}

function wireCopy() {
  for (const btn of docEl.querySelectorAll('.copy')) {
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(btn.dataset.code);
        btn.textContent = 'kopyalandı';
        btn.dataset.done = '1';
      } catch {
        btn.textContent = 'kopyalanamadı';
      }
      setTimeout(() => {
        btn.textContent = 'kopyala';
        delete btn.dataset.done;
      }, 1600);
    });
  }
}

let observer = null;
function observeHeadings() {
  if (observer) observer.disconnect();
  const links = new Map();
  for (const a of tocEl.querySelectorAll('a')) links.set(a.getAttribute('href').slice(1), a);
  if (!links.size) return;

  observer = new IntersectionObserver(
    (entries) => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        for (const a of links.values()) a.classList.remove('active');
        links.get(entry.target.id)?.classList.add('active');
      }
    },
    { rootMargin: '-70px 0px -72% 0px', threshold: 0 }
  );

  for (const id of links.keys()) {
    const el = document.getElementById(id);
    if (el) observer.observe(el);
  }
}

/* ── Arama ───────────────────────────────────────────────────────────────── */

function searchDocs(query) {
  const needle = query.toLocaleLowerCase('tr');
  const hits = [];

  for (const meta of flat) {
    const page = DOCS[meta.id];
    const body = page.body ?? '';
    const haystack = (page.heading + '\n' + body).toLocaleLowerCase('tr');
    const at = haystack.indexOf(needle);
    if (at < 0) continue;

    const plain = body.replace(/[`*#>|]/g, ' ').replace(/\s+/g, ' ');
    const pos = plain.toLocaleLowerCase('tr').indexOf(needle);
    const from = Math.max(0, pos - 70);
    const snippet = pos < 0 ? plain.slice(0, 150) : plain.slice(from, from + 190);

    hits.push({ meta, page, snippet: (from > 0 ? '…' : '') + snippet.trim() + '…', rank: at });
  }

  hits.sort((a, b) => a.rank - b.rank);
  return hits.slice(0, 24);
}

function showSearch(query) {
  markCurrent(null);
  tocEl.innerHTML = '';
  document.title = 'Arama · TRCrypto.Net';

  const hits = searchDocs(query);
  let html =
    '<div class="doc-head"><div class="doc-eyebrow">Arama</div><h1>' +
    esc(query) + '</h1><div class="doc-source">' +
    (hits.length ? hits.length + ' sayfada bulundu' : 'sonuç yok') + '</div></div>';

  if (!hits.length) {
    html += '<p class="empty">Bu terim dokümanlarda geçmiyor. Farklı bir yazım deneyin.</p>';
  } else {
    const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    html += '<div class="results">';
    for (const hit of hits) {
      html +=
        '<a class="result" href="#/' + hit.meta.id + '">' +
        '<div class="result-where">' + esc(hit.meta.group) + '</div>' +
        '<div class="result-title">' + esc(hit.page.heading) + '</div>' +
        '<div class="result-snip">' + esc(hit.snippet).replace(re, '<mark>$1</mark>') + '</div></a>';
    }
    html += '</div>';
  }

  docEl.innerHTML = html;
  window.scrollTo(0, 0);
}

/* ── Yonlendirme ─────────────────────────────────────────────────────────── */

function route() {
  const hash = decodeURIComponent(location.hash.replace(/^#/, ''));

  if (hash.startsWith('/ara/')) {
    const query = hash.slice(5).trim();
    if (query) {
      searchEl.value = query;
      showSearch(query);
      return;
    }
  }

  if (hash.startsWith('/')) {
    const [id, anchor] = hash.slice(1).split('#');
    showPage(id || 'giris', anchor);
    return;
  }

  // Sayfa ici bag: mevcut sayfada kal, hedefe kaydir.
  if (hash) {
    const target = document.getElementById(hash);
    if (target) {
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
  }

  showPage('giris');
}

let searchTimer = null;
searchEl.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const query = searchEl.value.trim();
  searchTimer = setTimeout(() => {
    if (query.length < 2) {
      if (location.hash.startsWith('#/ara/')) location.hash = '#/giris';
      return;
    }
    location.hash = '#/ara/' + encodeURIComponent(query);
  }, 220);
});

searchEl.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    searchEl.value = '';
    searchEl.blur();
    if (location.hash.startsWith('#/ara/')) location.hash = '#/giris';
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchEl && !e.metaKey && !e.ctrlKey) {
    e.preventDefault();
    searchEl.focus();
    searchEl.select();
  }
});

const SUN = '<circle cx="8" cy="8" r="3.1"/><path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1M12.9 12.9l-1.1-1.1M4.2 4.2L3.1 3.1" stroke-linecap="round"/>';
const MOON = '<path d="M13.4 9.6A5.8 5.8 0 0 1 6.4 2.6a5.9 5.9 0 1 0 7 7Z" stroke-linejoin="round"/>';

function currentlyDark() {
  const stamped = document.documentElement.getAttribute('data-theme');
  if (stamped) return stamped === 'dark';
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function paintThemeIcon() {
  document.getElementById('themeIcon').innerHTML = currentlyDark() ? MOON : SUN;
}

themeBtn.addEventListener('click', () => {
  const next = currentlyDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('trcrypto-theme', next); } catch {}
  paintThemeIcon();
});

try {
  const saved = localStorage.getItem('trcrypto-theme');
  if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
} catch {}

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintThemeIcon);

/* ── Baslat ──────────────────────────────────────────────────────────────── */

buildRail();
paintThemeIcon();
window.addEventListener('hashchange', route);
route();
